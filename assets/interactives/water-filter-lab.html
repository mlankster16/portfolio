<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Water Filter Lab</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url('../fonts/plus-jakarta-sans-latin.woff2') format('woff2');font-weight:200 800;font-display:swap}
:root{--navy:#13263A;--ink:#0F2E33;--muted:#4B6468;--line:#DCE8E3;--mint:#BFE5DA;--mint2:#EEF7F4;--teal:#0A6A67;--teal2:#0F8A86;--coral:#FF8A6B;--coral2:#FFF1EC;--coralD:#B8452A;--sun:#FFD84A;--paper:#F3F7F5;--band:58px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:2px;box-shadow:0 0 0 6px #fff}
p,h1,h2,h3{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab{max-width:1100px;margin:0 auto;padding:clamp(10px,2vw,16px);display:flex;flex-direction:column;gap:12px;position:relative}
:fullscreen .lab{padding-top:20px}

/* top bar */
.top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.top h1 svg{width:22px;height:22px}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:3px;background:var(--paper);border-radius:999px}
.steps button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
.steps button i{font-style:normal;font-size:12px;font-weight:700;width:18px;height:18px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--navy);color:#fff}
.steps button[aria-current="step"] i{background:var(--sun);color:var(--navy)}
.steps button:disabled{opacity:.5;cursor:not-allowed}
.tool{border:1px solid #C9D6D2;background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;position:relative;color:var(--navy);text-decoration:none}
.tool svg{width:16px;height:16px}
.tool:hover{border-color:var(--teal2)}
.tool .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid #fff}
@media (max-width:720px){.top nav{order:5;width:100%}.steps{justify-content:space-between}.steps button{padding:5px 6px 5px 4px;font-size:12.5px;gap:3px}.tool span.lbl{display:none}.tool{padding:8px 10px}}

/* guide strip */
.guide{background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.guide:focus{outline:none}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:12px;font-weight:700;letter-spacing:.02em}
.chips li{padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.28);color:#BFD0DC}
.chips li.on{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.chips li.did{border-color:var(--mint);color:var(--mint)}
.gmsg{font-size:16.5px;font-weight:500;line-height:1.4;text-wrap:pretty}
.gmsg small{display:block;font-size:14px;font-weight:400;color:#D5E3EC;margin-top:2px}
.gact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--sun);color:var(--navy);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14.5px}
.btn.ghost{background:none;border:1px solid rgba(255,255,255,.5);color:#fff}
.guide .btn:focus-visible{outline-color:var(--sun);box-shadow:none}
@media (max-width:620px){.guide{grid-template-columns:minmax(0,1fr)}.gmsg{font-size:15.5px}}

/* bench */
.bench{display:grid;grid-template-columns:206px minmax(0,1fr) 236px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line);position:relative}
.bench{--bb:linear-gradient(to top,#0E1D2D 0 6px,var(--navy) 6px calc(var(--band) - 3px),#3A5A78 calc(var(--band) - 3px) var(--band),transparent var(--band)),
  repeating-linear-gradient(0deg,transparent 0 43px,rgba(10,106,103,.07) 43px 44px),
  repeating-linear-gradient(90deg,transparent 0 43px,rgba(10,106,103,.07) 43px 44px),
  linear-gradient(#EFF7F4,#E2F0EB);background:var(--bb)}
.zone{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px 0;min-width:0;background:none}
.zl{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:rgba(255,255,255,.75);padding:2px 8px;border-radius:999px}
.ztray{padding-top:44px}
.tray{margin-bottom:calc(var(--band) - 16px);background:#F1E6CF;border:2px solid #CDB88F;border-radius:14px;padding:5px;display:grid;gap:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 -2px rgba(0,0,0,.18)}
.mat{border:1px solid transparent;background:rgba(255,255,255,.55);border-radius:10px;padding:4px 8px 4px 4px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;text-align:left;font-size:13.5px;font-weight:600;line-height:1.2;transition:transform .15s,box-shadow .15s,background .15s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mat svg{width:64px;height:43px;display:block;pointer-events:none}
.mat small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mat:hover:not(:disabled){background:#fff;transform:translateY(-2px);box-shadow:0 4px 10px rgba(19,38,58,.16)}
.mat[aria-pressed="true"]{background:var(--mint2);border-color:var(--teal)}
.mat[aria-pressed="true"] svg{opacity:.28}
.mat:disabled{cursor:not-allowed;opacity:.6}
.ghost-mat{position:fixed;z-index:50;pointer-events:none;width:72px;height:48px;margin:-24px 0 0 -36px;filter:drop-shadow(0 6px 8px rgba(19,38,58,.3));transition:transform .34s cubic-bezier(.3,.7,.3,1)}
.ghost-mat svg{width:72px;height:48px}

.zrig{flex-direction:row;justify-content:center;align-items:flex-end;gap:6px;padding-top:40px}
.rigwrap{width:min(268px,60%);margin-bottom:calc(var(--band) - 20px);border-radius:12px;transition:box-shadow .15s}
.rigwrap.over{box-shadow:0 0 0 3px var(--teal2)}
.rigwrap svg{display:block;width:100%;height:auto;overflow:visible}
.swcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:128px;flex:none}
.speed{font-size:12px;font-weight:600;color:var(--teal);background:rgba(255,255,255,.8);border-radius:8px;padding:3px 8px;text-align:center;line-height:1.3;min-height:22px;visibility:hidden}
.speed.on{visibility:visible}
.sw{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;border-radius:14px;margin-bottom:6px}
.sw svg{width:112px;height:126px;display:block}
.sw .swl{height:calc(var(--band) - 22px);display:grid;place-items:center;margin-top:6px;font-size:13px;font-weight:700;color:#fff;background:none;border-radius:999px;padding:0 12px}
.sw:not(:disabled) .swl{background:var(--coral);color:var(--navy)}
.sw:not(:disabled) .ring{stroke:var(--coral)}
.sw:disabled{cursor:default}
.sw:not(:disabled) .pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.zjars{padding-top:44px}
.jars{display:flex;justify-content:center;gap:6px;align-items:flex-end}
.jar{border:0;background:none;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;width:70px;transition:transform .15s}
.jar svg{width:70px;height:101px;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.jar span{height:calc(var(--band) - 16px);margin-top:6px;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:600;line-height:1.15;color:#fff}
.jar small{position:absolute}
.jar:hover:not(:disabled) svg{transform:translateY(-4px) rotate(-4deg)}
.jar svg{transition:transform .15s}
.jar.out svg{opacity:.25}
.jar:disabled{cursor:not-allowed}
.jar:focus-visible,.sw:focus-visible{box-shadow:none;outline-offset:0}

@media (max-width:820px){
 .bench{grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:none}
 .zone{background:var(--bb)}
 .zrig{grid-column:1/-1;order:3}
 .ztray .tray{grid-template-columns:1fr}
}
@media (max-width:560px){
 .bench{grid-template-columns:minmax(0,1fr)}
 .ztray,.zjars{padding-top:40px}
 .ztray .tray{grid-template-columns:repeat(3,minmax(0,1fr))}
 .mat{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:5px 3px;font-size:12.5px;gap:2px}
 .mat small{display:none}
 .swcol{width:112px}.sw svg{width:100px;height:112px}
}

/* lower panels */
.low{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px;align-items:start}
@media (max-width:820px){.low{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.panel h2{font-size:15px;font-weight:700}
.panel h2 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.rack{display:grid;grid-template-columns:auto 1px minmax(0,1fr);gap:12px;align-items:end}
.rack .div{background:var(--line);align-self:stretch}
.mine{display:flex;flex-direction:column;align-items:center;font-size:12.5px;font-weight:700;gap:2px}
.mine svg{width:68px;height:86px}
.samples{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;border-bottom:6px solid #CDB88F;border-radius:0 0 4px 4px;padding-bottom:2px}
.smp{border:2px solid transparent;background:none;border-radius:10px;padding:3px 0 1px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.smp svg{width:100%;max-width:56px;height:auto}
.smp:hover:not(:disabled){background:var(--mint2)}
.smp[aria-pressed="true"]{border-color:var(--teal);background:var(--mint2)}
.smp.no{border-color:var(--coralD);background:var(--coral2)}
.smp:disabled{cursor:default}
.rack.idle .samples,.rack.idle .mine{opacity:.5}
.scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-left:0}
.fb{font-size:14px;font-weight:600;color:var(--coralD);min-height:21px}
.fb.ok{color:var(--teal)}

.clip{background:#C9A56B;border-radius:16px;padding:16px 10px 10px;position:relative;box-shadow:inset 0 0 0 2px #B08A4E}
.clip::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:7px 7px 4px 4px;background:linear-gradient(#B7C3CA,#8597A2);box-shadow:0 0 0 2px var(--navy)}
.sheet{background:#fff;border-radius:6px;padding:14px 10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sheet h2{font-size:15px;font-weight:700}
.sheet h2 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
thead th{font-weight:700;color:var(--muted);font-size:12.5px;line-height:1.2}
tbody th{text-align:left;font-weight:600;line-height:1.2}
td.next{background:var(--mint2);box-shadow:inset 0 0 0 2px var(--teal2);border-radius:6px}
td .cell{display:inline-flex;align-items:center;gap:5px;text-align:left;line-height:1.15;font-weight:600}
td .cell svg{width:20px;height:26px;flex:none}
td .cell small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
td.pop .cell{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.dash{color:#9DB0B3}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13.5px;color:var(--muted)}
.foot b{color:var(--ink)}
.disc{font-size:13px;color:var(--muted)}

/* facilitator notebook */
.notes{position:absolute;z-index:20;top:54px;right:clamp(10px,2vw,16px);width:min(340px,calc(100% - 20px));background:#FFFBEF;border:1px solid #E6D9B8;border-radius:16px;box-shadow:0 14px 40px rgba(19,38,58,.28);padding:16px 16px 14px 30px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55;
 background-image:linear-gradient(90deg,transparent 19px,#F3B7A4 19px 20.5px,transparent 20.5px)}
.notes[hidden]{display:none}
.notes h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.notes h2:focus{outline:none}
.notes .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.notes h3{font-size:14px;font-weight:700;margin-bottom:1px}
.notes p{color:#2F4A4E}
.notes .x{position:absolute;top:10px;right:10px;border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.notes .x:hover{background:#F3EBD3}
.wheel{display:flex;gap:3px;list-style:none;margin:0;padding:0;font-size:12px;font-weight:700;flex-wrap:wrap;align-items:center}
.wheel li{padding:2px 7px;border-radius:999px;background:#F3EBD3;color:#6B5B33}
.wheel li.on{background:var(--navy);color:#fff}
.wheel li.loop{background:none;padding:0 2px;color:var(--teal);font-size:14px}
.notes .small{font-size:13px;color:var(--muted);border-top:1px dashed #E0D2AC;padding-top:8px}
@media (max-width:560px){.notes{position:static;width:auto;box-shadow:0 2px 10px rgba(19,38,58,.15)}}

/* steps 1, 3, 4, 5 */
.hint{font-size:13.5px;color:var(--muted)}
.tag{display:inline-block;font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sun);color:var(--navy)}
.bench.one{grid-template-columns:minmax(0,1fr)}
.bench.plan{grid-template-columns:206px minmax(0,1fr) 262px}
.bench.create{grid-template-columns:206px minmax(0,1fr) 170px}
.zask{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-around;gap:10px 24px;padding-top:46px;min-height:250px}
.wallnote{max-width:300px;background:#FFFBEF;border:1px solid #E6D9B8;border-radius:4px;padding:14px 16px 12px;margin-bottom:calc(var(--band) + 18px);font-size:14.5px;line-height:1.5;box-shadow:0 3px 8px rgba(19,38,58,.14);transform:rotate(-1.2deg);position:relative}
.wallnote::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--coral);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.wallnote b{display:block;font-size:16px;margin-bottom:2px}
.jar.fig{cursor:default;position:relative}
.jar.big{width:92px}.jar.big svg{width:88px;height:127px}
.jar.dcup svg{width:70px;height:89px;filter:none}
.jar.dcup{width:84px}
.jar span small{display:block;position:static;font-weight:400;font-size:12px;color:#D5E3EC}
.jar .tag{margin-bottom:4px}
.zask .jars{flex-wrap:wrap;gap:6px 10px}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.crit{grid-template-columns:minmax(0,1fr)}}
.nextrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.nextrow .btn{background:var(--navy);color:#fff}
.nextrow .btn:disabled{opacity:.4;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.chd{display:flex;align-items:center;gap:10px}
.chd .ci{flex:none;width:36px;height:36px;border-radius:10px;background:var(--mint2);color:var(--teal);display:grid;place-items:center}
.chd .ci svg{width:21px;height:21px}
.chd h2{font-size:15px;font-weight:700;line-height:1.3}
.chd h2 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{width:100%;border:1px solid #C9D6D2;background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;line-height:1.35;text-align:left}
.opt:hover{border-color:var(--teal2)}
.opt.ok{background:var(--mint2);border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.opt.no{background:var(--coral2);border-color:var(--coralD)}
.fbk{font-size:13.5px;line-height:1.45;min-height:20px}
.fbk.ok{color:var(--teal)}.fbk.no{color:#8A3A22}
.samples.strip{max-width:360px}
div.smp{cursor:default}
.mat small.pts{display:inline-block;margin-top:2px;background:var(--coral2);color:#8A3A22;font-weight:700;border-radius:999px;padding:0 7px}
.mat.stat{cursor:default}.mat.stat:hover{background:rgba(255,255,255,.55);transform:none;box-shadow:none}
.zplan{padding-top:44px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:calc(var(--band) + 12px);display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 8px rgba(19,38,58,.12)}
.wcard:focus{outline:none}
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;counter-reset:l}
.layers li{counter-increment:l;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 9px;font-size:13.5px;font-weight:600;line-height:1.2;background:var(--paper)}
.layers .ln::before{content:counter(l) ". "}
.layers small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lb{display:flex;gap:3px}
.ic{border:1px solid #C9D6D2;background:#fff;border-radius:8px;width:30px;height:30px;padding:0;font-size:15px;line-height:1}
.ic:disabled{opacity:.35;cursor:not-allowed}
.ic:hover:not(:disabled){border-color:var(--teal2)}
.costline{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;border-top:1px dashed var(--line);padding-top:7px}
.costline b{background:var(--coral2);color:#8A3A22;border-radius:999px;padding:1px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;font-size:15px}
.ptag{background:var(--coral2);border:1px solid #F6CDBE;border-radius:8px;padding:3px 9px;font-size:13.5px;font-weight:500}
.ptag b{font-size:15px;margin-left:3px}
.nums{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:10px}
.num{border:1px solid #C9D6D2;background:#fff;border-radius:10px;padding:9px 0;font-weight:700;font-size:15px}
.num:hover{border-color:var(--teal2);background:var(--mint2)}
.num.no{border-color:var(--coralD);background:var(--coral2)}
.band{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;margin-bottom:4px}
.band b{width:76px;flex:none}
.band span{border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 2px;display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.band span i{font-style:normal;font-weight:700;width:18px;height:18px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.band span.on{background:var(--navy);border-color:var(--navy);color:#fff}
.band span.on i{background:var(--sun);color:var(--navy)}
.scroll{overflow-x:auto}
table.dt{table-layout:auto}
.dt .sm{display:none}
table.dt td small,table.dt th small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
table.dt .ly{text-align:left;font-size:12.5px;line-height:1.3}
table.dt tr.best{background:var(--mint2)}
table.dt tr.popr td,table.dt tr.popr th{animation:rowin .6s ease-out}
@keyframes rowin{0%{background:var(--sun)}100%{background:transparent}}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.panel.town{background:var(--coral2);border-color:#F6CDBE}
.panel.town h2 small{color:#5A3A2C}
.toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid #E9B9A8;border-radius:999px;padding:6px 14px 6px 6px;background:#fff;font-size:14px;font-weight:600}
.toggle .t{width:36px;height:22px;border-radius:999px;background:#C9D6D2;position:relative;transition:background .2s}

}
function planChange(focus) { S.built = false; setLayers(S.layers); ui(); if (focus) { var el = document.querySelector(focus); if (el && !el.disabled) el.focus({ preventScroll: true }); else $('plan').focus({ preventScroll: true }); } }

/* ---------- 4 Create ---------- */
function vCreate() {
  var n = S.designs.length + (S.built ? 0 : 1);
  return '<div class="bench create">' +
   '<div class="zone ztray"><span class="zl">Design #' + n + '</span><div class="tray" role="list" aria-label="Your layers, top to bottom">' + S.layers.map(function (k) { return '<div class="mat stat" role="listitem">' + matArt(k) + '<span>' + M[k].n + '<small class="pts">' + pts(M[k].cost) + '</small></span></div>'; }).join('') + '</div></div>' +
   rigZone(true) +
   '<div class="zone zjars"><span class="zl">Dirty water</span><div class="jars"><button class="jar big" data-w="mystery" aria-label="Pour Mystery water and start the timer">' + jarArt(W.mystery) + '<span>Mystery water</span></button></div></div></div>' +
   '<div class="low" style="margin-top:12px">' + rackPanel() +
   '<section class="clip" aria-labelledby="dsH"><div class="sheet"><h2 id="dsH">Score sheet<small>Each score is 1 to 5. Lower is better.</small></h2><div id="bands"></div><div id="dsheet" class="scroll"></div></div></section></div>';
}
function uiCreate() {
  var busy = benchButtons(), ph = T.phase, n = S.designs.length + (S.built ? 0 : 1), w = W.mystery, last = S.designs[S.designs.length - 1];
  var jar = document.querySelector('.jar[data-w]'); jar.disabled = busy || !(ph === 'setup' || ph === 'retry'); jar.classList.toggle('out', busy);
  var msg = '', act = '', i = { setup: 0, run: 0, drain: 0, retry: 0, pmatch: 1, cmatch: 2, cost: 3, record: 4, done: 4 }[ph];
  if (ph === 'setup') msg = 'Design #' + n + ' is built. Pour the Mystery water through it.<small>The timer starts when you pour. Stop it when the water reaches the ¼ cup line.</small>';
  if (ph === 'run' || ph === 'drain') msg = 'Watch the cup. Stop the timer when the water reaches the ¼ cup line.<small>Look at the layers too. What is each one catching?</small>';
  if (ph === 'retry') { msg = retryMsg(); act = retryAct(); }
  if (ph === 'pmatch') msg = 'Time: ' + T.read + ' seconds. Now look for particles. Which sample cup has about as many bits and as much cloudiness as your cup?';
  if (ph === 'cmatch') msg = 'Now look at the color. Which sample cup is closest to the color of your cup?';
  if (ph === 'cost') msg = 'Last measure: cost. Add up the price of every material in your filter.<small>How many points does design #' + n + ' cost?</small>';
  if (ph === 'record') { msg = 'Particles: cup ' + T.pP + '. Color: cup ' + T.pC + '. Time: ' + T.read + ' seconds. Cost: ' + pts(T.cost) + '.<small>Write your results on the score sheet.</small>'; act = '<button class="btn" data-act="record">Record on score sheet</button>'; }
  if (ph === 'done' && last) { msg = 'Design #' + S.designs.length + ' scores ' + tot(last.s) + '. Lower is better.<small>You predicted sample cup ' + last.predict + ' for particles. Your test showed cup ' + last.s.particles + '.</small>'; act = '<button class="btn" data-go="4">Next: improve</button>'; }
  guideSet(procChips(['1 Pour and time', '2 Particles', '3 Color', '4 Cost', '5 Record'], i, ph === 'done'), msg, act);
  var col = ph === 'cmatch', has = !!T.res && i >= 1;
  rack({ w: w, kind: col ? 'color' : 'particles', on: ph === 'pmatch' || ph === 'cmatch', has: has, res: T.res, pick: 0, hide: ph === 'cost', good: ph !== 'pmatch' && ph !== 'cmatch' && ph !== 'cost' || /^Good|^Your lab/.test(T.fb),
   title: ph === 'cost' ? 'Add up the cost' : col ? 'Sample cups: color' : 'Sample cups: particles',
   sub: ph === 'cost' ? 'Count every material, not just the priciest one.' : col ? 'Cup 1 has no color. Cup 5 is as dark as the Mystery water.' : 'Cup 1 has no bits or cloudiness. Cup 5 has as much as the Mystery water.' });
  $('costq').innerHTML = ph !== 'cost' ? '' : '<div class="tags">' + S.layers.map(function (k) { return '<span class="ptag">' + M[k].n + ' <b>' + M[k].cost + '</b></span>'; }).join('<span>+</span>') + '<span>= ?</span></div><div class="nums" role="group" aria-label="Total cost in points">' + [1, 2, 3, 4, 5, 6, 7, 8].map(function (v) { return '<button class="num' + (T.wrong === v ? ' no' : '') + '" data-c="' + v + '" aria-label="' + pts(v) + '">' + v + '</button>'; }).join('') + '</div>';
  var showT = i >= 1 && T.read != null, showC = (ph === 'record' || ph === 'done') && T.cost != null;
  $('bands').innerHTML = bands(showT ? tScore(T.read) : 0, showC ? cScore(T.cost) : 0);
  $('dsheet').innerHTML = designTable(false);
  T.popKey = '';
}
function pickCost(n) {
  if (T.phase !== 'cost') return;
  var c = costOf(S.layers); T.tries++;
  if (n !== c && T.tries < 3) { T.wrong = n; T.fb = 'Check your adding. Count every price tag.'; ui(); focusSel('.num[data-c="' + n + '"]'); return; }
  T.fb = n === c ? 'That’s right: ' + pts(c) + '.' : 'Your lab partner added it up too: ' + pts(c) + '.';
  T.cost = c; T.wrong = 0; T.tries = 0; T.phase = 'record'; ui(); focusSel('#guide [data-act]');
}

/* ---------- 5 Improve ---------- */
function why(d) {
  var s = d.s, out = [], top = M[d.layers[0]];
  out.push(s.particles <= 2 ? '<b>Particles:</b> your layers caught most of the bits and cloudiness.' : '<b>Particles:</b> a lot of bits or cloudiness got through. Check your data sheet. Which materials caught the most?');
  out.push(s.color >= 4 ? '<b>Color:</b> most of the color came through. Did any material lighten the color in your tests?' : '<b>Color:</b> your layers took out a lot of the color.');
  if (top.fineLayer) out.push('<b>Time:</b> a fine material is on top, so the big bits land on it first and slow the water to a drip. What could you put above it?');
  else if (s.time >= 4) out.push('<b>Time:</b> slow layers add up. Taking one out speeds things up, but more may get through.');
  else out.push('<b>Time:</b> ' + d.sec + ' seconds. Would a different order be faster?');
  if (s.cost >= 4) out.push('<b>Cost:</b> this filter uses a lot of materials. Is every layer doing a job?');
  out.push('<b>Prediction:</b> you expected sample cup ' + d.predict + ' for particles and got cup ' + s.particles + '.' + (d.predict === s.particles ? ' Your evidence pointed you the right way.' : ' What does that tell you?'));
  return out;
}
function vImprove() { return '<div id="imp"></div>'; }
function uiImprove() {
  var ds = S.designs, best = bestIdx(), last = ds[ds.length - 1], show = ds.slice(-6), off = ds.length - show.length;
  $('imp').innerHTML = '<div class="bench one"><div class="zone zask"><span class="zl">Line up your cups</span>' +
   '<div class="jars" role="group" aria-label="Filtered water from each design, next to the Mystery water"><div class="jar fig big">' + jarArt(W.mystery) + '<span>Mystery water</span></div>' +
   show.map(function (d, i) { var k = i + off; return '<div class="jar fig dcup">' + (k === best && ds.length > 1 ? '<em class="tag">Best</em>' : '') + cupArt(d.r, .8) + '<span>Design #' + (k + 1) + '<small>Total ' + tot(d.s) + '</small></span></div>'; }).join('') + '</div></div></div>' +
   '<div class="low" style="margin-top:12px"><div style="display:flex;flex-direction:column;gap:12px;min-width:0">' +
   '<section class="panel"><h2>What the test of design #' + ds.length + ' showed</h2><ul class="why">' + why(last).map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></section>' +
   '<section class="panel town"><h2>What if the town cared most about clean water?<small>A cheap filter that leaves the water dirty could make people sick. Count particles and color double. Does your best design change?</small></h2><div><button class="toggle" data-town aria-pressed="' + S.town + '"><span class="t" aria-hidden="true"></span>Clean water counts double</button></div></section></div>' +
   '<section class="clip" aria-labelledby="dsH"><div class="sheet"><h2 id="dsH">Score sheet<small>Each score is 1 to 5. Lower is better, so the lowest total wins.</small></h2><div id="dsheet" class="scroll">' + designTable(true) + '</div></div></section></div>';
  guideSet([['Designs tested: ' + ds.length, 'did'], ['Best total: ' + tot(ds[best].s), 'on']],
   ds.length === 1 ? 'You have one tested design. Engineers almost never stop at one.<small>Look at the evidence. Change one or two things, then test again.</small>' : 'Compare your designs. No filter wins on every measure.<small>What changed between them? Which change helped, and what did it cost you?</small>',
   '<button class="btn" data-act="redesign">Redesign: back to Plan</button><button class="btn ghost" data-act="reset">Start over</button>');
}

/* ---------- actions shared by Imagine and Create ---------- */
function place(k) {
  if (rig.run) return;
  if (S.step === 1) { var keep = T.water || T.lastW; newTest(); T.mat = k; T.lastW = keep; setLayers([k]); showTime(0); ui(); say(M[k].n + ' is in the filter holder.'); }
  else if (S.step === 2 && S.layers.indexOf(k) < 0 && S.layers.length < 4) { S.layers.unshift(k); planChange(); say(M[k].n + ' added on top. ' + S.layers.length + (S.layers.length === 1 ? ' layer.' : ' layers.')); }
}
function fly(btn, k) {
  if (reduce) return place(k);
  var a = btn.querySelector('svg').getBoundingClientRect(), b = $('rigwrap').getBoundingClientRect();
  var g = document.createElement('div'); g.className = 'ghost-mat'; g.innerHTML = matArt(k);
  g.style.left = a.left + a.width / 2 + 'px'; g.style.top = a.top + a.height / 2 + 'px';
  document.body.appendChild(g);
  requestAnimationFrame(function () { g.style.transform = 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top + b.height * .28 - a.top - a.height / 2) + 'px) scale(.9)'; });
  setTimeout(function () { g.remove(); place(k); }, 360);
}
function pour(wk) {
  if (rig.run) return;
  var keys = S.step === 1 ? (T.mat ? [T.mat] : []) : S.layers.slice();
  if (!keys.length) { gCache = ''; $('guide').querySelector('.gmsg').innerHTML = 'The holder is empty. Put a material in the filter holder first.<small>Pick one from the materials tray.</small>'; return; }
  if (S.step === 3 && S.built) return;
  var mat = T.mat, fails = T.water === wk ? T.fails : 0; newTest(); T.mat = mat; T.water = wk; T.fails = fails; T.phase = 'run';
  setLayers(keys);
  var R = startRun(keys, wk, function () { T.phase = 'drain'; ui(); }, function (R) {
    T.res = R.r;
    if (R.ok) { T.phase = S.step === 1 ? 'match' : 'pmatch'; T.read = Math.round(R.read); }
    else { T.phase = 'retry'; T.fails++; T.off = R.off; T.missed = R.missed; }
    ui(); $('guide').focus({ preventScroll: true });
  });
  $('speed').textContent = 'Lab clock is sped up ×' + (R.sec / R.D).toFixed(1);
  ui();
  $('sw').focus({ preventScroll: true });
  say('Pouring ' + W[wk].n + '. The timer is running. Stop it when the water reaches the quarter cup line.');
  if (innerWidth <= 820) $('rigwrap').scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
}
function pickSample(n) {
  var ph = T.phase, w = W[T.water], r = T.res, v;
  if (ph === 'match') v = 1 + 4 * dirt(r, w); else if (ph === 'pmatch') v = 1 + 4 * (r.big + r.fine) / (w.big + w.fine); else if (ph === 'cmatch') v = 1 + 4 * r.color / w.color; else return;
  T.tries++;
  var ok = Math.abs(n - v) <= .75;
  if (!ok && T.tries < 3) { T.wrong = n; T.fb = 'Look again. Your cup ' + (ph === 'cmatch' ? 'has ' + (n > v ? 'less' : 'more') + ' color than' : 'is ' + (n > v ? 'cleaner' : 'dirtier') + ' than') + ' sample cup ' + n + '.'; ui(); focusSel('.smp[data-s="' + n + '"]'); return; }
  var val = ok ? n : Math.max(1, Math.min(5, Math.round(v))), note = ok ? 'Good match.' : 'Your lab partner checked too. Sample cup ' + val + ' is the closest match.';
  T.wrong = 0; T.tries = 0;
  if (ph === 'match') { T.pick = val; T.phase = 'record'; T.fb = note; ui(); focusSel('#guide [data-act]'); }
  else if (ph === 'pmatch') { T.pP = val; T.phase = 'cmatch'; T.fb = note + ' Particles: cup ' + val + '.'; ui(); focusSel('.smp'); }
  else { T.pC = val; T.phase = 'cost'; T.fb = note + ' Color: cup ' + val + '.'; ui(); focusSel('.num'); }
}
function record() {
  if (S.step === 1) {
    var key = T.mat + '|' + T.water, m = M[T.mat], w = W[T.water];
    S.tests[key] = { r: T.res, sec: T.read, cup: T.pick };
    T.phase = 'done'; T.popKey = key; T.fb = '';
    T.ask = m.fineLayer && w.big > .2 ? 'That one was slow. Look at the top of the filter. What is sitting there?' : T.pick >= 4 ? 'A lot got through. What did this material let pass?' : T.pick <= 2 ? 'That water looks much cleaner. What did this material catch?' : 'Some got caught and some got through. What do you see in the cup?';
    ui(); $('guide').focus({ preventScroll: true });
    say(m.n + ' with ' + w.n + ' recorded: sample cup ' + T.pick + ', ' + T.read + ' seconds.');
  } else {
    var s = { particles: T.pP, color: T.pC, time: tScore(T.read), cost: cScore(T.cost) };
    S.designs.push({ layers: S.layers.slice(), r: T.res, sec: T.read, costPts: T.cost, s: s, predict: S.predict });
    S.built = true; S.max = 4; T.phase = 'done'; T.popKey = 'd'; T.fb = '';
    ui(); $('guide').focus({ preventScroll: true });
    say('Design ' + S.designs.length + ' recorded. Particles ' + s.particles + ', color ' + s.color + ', time ' + s.time + ', cost ' + s.cost + '. Total ' + tot(s) + '.');
  }
}

/* ---------- frame: steps, notes, full screen ---------- */
var VIEWS = [vAsk, vImagine, vPlan, vCreate, vImprove], UIS = [uiAsk, uiImagine, uiPlan, uiCreate, uiImprove];
function can(i) { if (i === 0) return true; if (i === 4) return S.designs.length > 0; if (!agreedAll()) return false; if (i === 1) return true; if (Object.keys(S.tests).length < 3) return false; return i === 2 || (S.layers.length > 0 && S.predict != null); }
function steps() {
  $('steps').innerHTML = STEPS.map(function (n, i) { return '<li><button data-go="' + i + '"' + (i === S.step ? ' aria-current="step"' : '') + (can(i) ? '' : ' disabled') + '><i>' + (i + 1) + '</i>' + n + '</button></li>'; }).join('');
  var seen = S.seenNote[S.step]; $('notesDot').hidden = !!seen; $('notesNew').hidden = !!seen;
}
function ui() { var a = document.activeElement, go = a && a.dataset && a.dataset.go && a.closest('#steps') ? a.dataset.go : null; steps(); if (go != null) focusSel('#steps [data-go="' + go + '"]'); UIS[S.step](); report(); }
function go(i, quiet) {
  if (!can(i)) return;
  rig.run = null; cancelAnimationFrame(rig.raf);
  S.step = i; S.max = Math.max(S.max, i); newTest(); gCache = '';
  $('view').innerHTML = VIEWS[i]();
  if (i === 1) setLayers([]);
  if (i === 2) setLayers(S.layers);
  if (i === 3) {
    setLayers(S.layers);
    if (S.built) { var d = S.designs[S.designs.length - 1]; T.phase = 'done'; T.water = 'mystery'; T.res = d.r; T.read = d.sec; T.cost = d.costPts; draw(.8, 0, W.mystery, d.r, false, false, 0); showTime(d.sec); rigLabel('Cup: filtered water collected.'); }
  }
  if (!$('notes').hidden) notes(true, true);
  ui();
  if (!quiet) { $('guide').focus(); say('Step ' + (i + 1) + ': ' + STEPS[i] + '.'); }
}
function notes(open, keep) {
  var el = $('notes'), nt = NOTES[S.step];
  $('notesBtn').setAttribute('aria-expanded', open);
  if (!open) { el.hidden = true; report(); return; }
  S.seenNote[S.step] = 1; steps();
  el.innerHTML = '<button class="x" id="notesX" aria-label="Close facilitator’s notes">×</button><span class="k">From the summer institute</span><h2 id="notesH" tabindex="-1">Facilitator’s notes</h2>' +
   '<ol class="wheel" aria-label="Engineering design process, step ' + (S.step + 1) + ' of 5">' + STEPS.map(function (n, i) { return '<li class="' + (i === S.step ? 'on' : '') + '">' + n + '</li>'; }).join('') + '<li class="loop" aria-label="then around again">↺</li></ol>' +
   '<div><h3>What teachers did in ' + STEPS[S.step] + '</h3><p>' + nt[0] + '</p></div><div><h3>What I coached for</h3><p>' + nt[1] + '</p></div>' +
   '<p class="small">The lab on this page is written for students. These notes are for you: they describe the in-person institute this lab is based on.</p>';
  el.hidden = false; if (!keep) $('notesH').focus({ preventScroll: true }); report();
}
function say(t) { $('live').textContent = ''; setTimeout(function () { $('live').textContent = t; }, 40); }
function report() { if (window.parent !== window && !document.fullscreenElement) window.parent.postMessage({ type: 'embed-resize', height: document.documentElement.scrollHeight }, '*'); }

document.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  var d = t.dataset, L = S.layers, i;
  if (d.go != null) go(+d.go);
  else if (d.m) {
    if (dragged) return;
    if (S.step === 1) { if (d.m !== T.mat || T.phase !== 'setup') fly(t, d.m); }
    else if (L.indexOf(d.m) > -1) { L.splice(L.indexOf(d.m), 1); planChange(); say(M[d.m].n + ' taken out.'); }
    else fly(t, d.m);
  }
  else if (d.w) pour(d.w);
  else if (t.id === 'sw') stopRun(false);
  else if (d.s) pickSample(+d.s);
  else if (d.c) pickCost(+d.c);
  else if (d.p) { S.predict = +d.p; ui(); focusSel('#pred [data-p="' + d.p + '"]'); }
  else if (d.meas) { S.agreed[d.meas] = +d.j; ui(); focusSel('[data-meas="' + d.meas + '"][data-j="' + d.j + '"]'); }
  else if (d.up != null) { i = +d.up; L.splice(i - 1, 0, L.splice(i, 1)[0]); planChange('[data-up="' + (i - 1) + '"]'); say(M[L[i - 1]].n + ' moved up to layer ' + i + '.'); }
  else if (d.dn != null) { i = +d.dn; L.splice(i + 1, 0, L.splice(i, 1)[0]); planChange('[data-dn="' + (i + 1) + '"]'); say(M[L[i + 1]].n + ' moved down to layer ' + (i + 2) + '.'); }
  else if (d.rm != null) { var k = L.splice(+d.rm, 1)[0]; planChange('#plan'); say(M[k].n + ' taken out.'); }
  else if ('town' in d) { S.town = !S.town; ui(); focusSel('[data-town]'); say(S.town ? 'Particles and color now count double.' : 'All measures count the same.'); }
  else if (d.act === 'again') pour(T.water);
  else if (d.act === 'partner') { T.read = filter(S.step === 1 ? [T.mat] : S.layers, W[T.water]).sec; T.phase = S.step === 1 ? 'match' : 'pmatch'; showTime(T.read); ui(); $('guide').focus({ preventScroll: true }); }
  else if (d.act === 'record') record();
  else if (d.act === 'redesign') { S.built = false; S.predict = null; go(2); }
  else if (d.act === 'reset') { var seen = S.seenNote; S = fresh(); S.seenNote = seen; go(0); }
  else if (t.id === 'notesBtn') notes($('notes').hidden);
  else if (t.id === 'notesX') { notes(false); $('notesBtn').focus(); }
  else if (t.id === 'fsBtn') { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () { window.open(location.href, '_blank', 'noopener'); }); else window.open(location.href, '_blank', 'noopener'); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('notes').hidden) { notes(false); $('notesBtn').focus(); } });
document.addEventListener('fullscreenchange', function () { $('fsLbl').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; report(); });

/* drag a material onto the holder (mouse and pen; touch uses tap) */
var drag = null, dragged = false;
document.addEventListener('pointerdown', function (e) { var b = e.target.closest && e.target.closest('button.mat'); if (!b || b.disabled || e.pointerType === 'touch' || e.button) return; drag = { b: b, k: b.dataset.m, x: e.clientX, y: e.clientY, g: null }; });
document.addEventListener('pointermove', function (e) {
  if (!drag) return;
  if (!drag.g && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.g = document.createElement('div'); drag.g.className = 'ghost-mat'; drag.g.style.transition = 'none'; drag.g.innerHTML = matArt(drag.k); document.body.appendChild(drag.g); }
  if (drag.g) { drag.g.style.left = e.clientX + 'px'; drag.g.style.top = e.clientY + 'px'; $('rigwrap').classList.toggle('over', overRig(e)); }
});
function overRig(e) { var r = $('rigwrap').getBoundingClientRect(); return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom; }
function endDrag(e) {
  if (!drag) return;
  if (drag.g) { drag.g.remove(); $('rigwrap').classList.remove('over'); dragged = true; setTimeout(function () { dragged = false; }, 0); if (e.type === 'pointerup' && overRig(e)) place(drag.k); }
  drag = null;
}
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);

if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
window.addEventListener('load', report);
go(0, true);
})();
</script>
<script>if(window.parent!==window){var fb=document.getElementById('fsBtn');if(fb)fb.hidden=true;}</script>
</body>
