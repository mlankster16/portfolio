<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out of Thin Air: Flight Deck</title>
<style>
/* Self-hosted fonts (assets/fonts) */
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500 700;font-display:swap;src:url('../fonts/unbounded-latin.woff2') format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url('../fonts/figtree-latin.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('../fonts/space-grotesk-latin.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;src:url('../fonts/newsreader-italic-latin.woff2') format('woff2')}
:root{--bg:#090e22;--panel:rgba(13,19,46,.88);--line:rgba(243,234,214,.17);--cream:#f3ead6;--ink:#1d1a2e;--dim:#cdc9e6;--mute:#a9a6cc;--orange:#ff8552;--orange-d:#b9532c;--blue:#8fc3ff;--ok:#bfe8c8;--try:#ffe2a8;--green:#5fe39a;--amber:#ffc24a;--red:#ff6b5e;--mono:'Space Grotesk',system-ui,sans-serif;--head:'Unbounded','Space Grotesk',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--cream);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--orange)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
[aria-disabled=true],button:disabled{opacity:.42;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
strong{font-weight:700}
@keyframes fIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.35}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}50%{transform:scale(.94,1.06) rotate(1.5deg)}}
@keyframes twk{0%,100%{opacity:1}50%{opacity:.55}}

/* Sky */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#03050d,#080d28 70%,#0d1640)}
#sky i{position:absolute;inset:0;transition:opacity 1.8s ease}
.sk-strat{background:linear-gradient(180deg,#071034 0%,#123680 62%,#3d7ccc 100%)}
.sk-dusk{background:linear-gradient(180deg,#131943 0%,#3a2f6b 46%,#a65f7a 80%,#f2a48a 100%)}
.sk-dawn{background:linear-gradient(180deg,#27306a 0%,#8a5f8f 46%,#f0a27a 78%,#ffd9a0 100%)}
#sky .sk-stars{inset:auto;left:0;top:0;width:2px;height:2px;border-radius:50%;background:transparent;animation:twk 5s ease-in-out infinite}
#sky .sk-cloud{inset:auto;left:0;height:46px;border-radius:999px;background:rgba(243,234,214,.16);filter:blur(6px);animation:drift 120s linear infinite}
.sk-veil{background:linear-gradient(180deg,rgba(9,14,34,.08),rgba(9,14,34,.5) 520px,rgba(9,14,34,.62))}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* HUD */
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:clamp(10px,2vw,18px);padding:8px clamp(12px,3vw,32px);background:rgba(9,14,34,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-t{flex:none;font:600 12px/1.25 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
.stripes{display:block;height:6px;width:56px;margin-top:5px;border-radius:2px;background:linear-gradient(180deg,var(--orange) 0 33%,var(--cream) 33% 66%,var(--blue) 66%)}
.prof{flex:1;min-width:0;position:relative;height:58px}
.prof-in{position:absolute;left:16px;right:16px;top:0;bottom:0}
.prof svg.pl{position:absolute;left:0;top:0;width:100%;height:40px;overflow:visible}
.prof .wp{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--bg);border:1.5px solid rgba(243,234,214,.45)}
.prof .wp.on{background:var(--orange);border-color:var(--orange)}
.prof .wl{position:absolute;top:42px;transform:translateX(-50%);font:600 11px var(--mono);color:var(--mute);white-space:nowrap}
.prof .wl.on{color:var(--cream)}
.prof .bal{position:absolute;width:20px;height:26px;margin:-27px 0 0 -10px;transition:left .9s cubic-bezier(.3,.8,.3,1),top .9s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.alt-read{flex:none;display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:baseline;justify-items:end;font-family:var(--mono);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#050816}
.alt-read .ar-n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);min-width:62px;text-align:right}
.alt-read .ar-u{font-size:11px;font-weight:700;color:var(--mute)}
.alt-read .ar-leg{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute)}
@media (max-width:680px){.prof .wl{display:none}.prof{height:42px}.hud-t span.t2{display:none}}
@media (max-width:460px){.hud-t{font-size:11px;letter-spacing:.1em}.alt-read .ar-n{font-size:16px;min-width:50px}}

main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:clamp(18px,4vw,36px) clamp(14px,4vw,32px) 56px;display:flex;flex-direction:column;gap:20px}
main>div:empty,main>nav:empty{display:none}
#comms,#gate{display:flex;flex-direction:column}
.lbl{font:700 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.orange{color:var(--orange)}.blue{color:var(--blue)}.rust{color:#9a4a2e}.dim{color:var(--dim)}
.q{font-size:16px;font-weight:600;line-height:1.5}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}

/* Title */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding-top:clamp(4px,2vh,18px)}
.head h1{margin:6px 0 0;font-family:var(--head);font-weight:600;font-size:clamp(25px,3.6vw,38px);line-height:1.1}
.fig{width:230px;height:144px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 17px,rgba(143,195,255,.09) 17px 18px),repeating-linear-gradient(90deg,transparent 0 17px,rgba(143,195,255,.09) 17px 18px),rgba(9,14,34,.55)}
.fig svg{display:block;width:100%;height:100%}
.fig text,.route text,.reel text,.cam text{font-family:var(--mono);font-weight:600;letter-spacing:.08em}
@media (max-width:620px){.fig{display:none}}

/* Panels */
.panel{position:relative;padding:clamp(16px,2.6vw,24px);border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.panel[data-tag]::before{content:attr(data-tag);position:absolute;top:-10px;right:18px;font:700 11px var(--mono);letter-spacing:.14em;padding:2px 9px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.panel.hot{border-color:rgba(255,133,82,.5);background:rgba(34,16,24,.88)}
.sheet{background:var(--cream);color:#2a2238;border-color:#d9c9a5}
.pt{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.sheet .sub{border-top-color:#d9c9a5}
.well{padding:14px 16px;border-radius:12px;background:rgba(5,8,22,.6);border:1px solid var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 15px;border-radius:10px;border:1.5px solid var(--orange);background:transparent;color:var(--cream);font-size:15px;font-weight:600;line-height:1.3;text-align:left}
.opt:hover{background:rgba(255,133,82,.12)}
.opt[aria-pressed=true],.opt.on{background:var(--orange);color:#1a0f08}
.opt.bl{border-color:var(--blue)}.opt.bl[aria-pressed=true]{background:var(--blue);color:#0f1430}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#0f1430}
.opt.try{background:var(--try);border-color:var(--try);color:#0f1430}
.sheet .opt{border-color:#2a2238;color:#2a2238}.sheet .opt:hover{background:rgba(42,34,56,.08)}.sheet .opt[aria-pressed=true]{background:#2a2238;color:var(--cream)}
.opt small{display:block;font-size:12.5px;font-weight:500;opacity:.88}
.fb{margin:0;padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.5;color:#0f1430;background:var(--try);border-left:5px solid #c98a12}
.fb.ok{background:var(--ok);border-left-color:#2d8a4e}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}

/* Goal strip */
.goal{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;border:1.5px solid var(--orange);background:rgba(255,133,82,.1)}
.goal.done{border-color:var(--ok);background:rgba(191,232,200,.12)}
.goal .gi{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;background:var(--orange);color:#0f1430}
.goal.done .gi{background:var(--ok)}
.goal .gk{display:block;color:var(--orange)}.goal.done .gk{color:var(--ok)}
.goal .gt{font-size:15.5px;font-weight:600;line-height:1.45}

/* Comms */
.comms{width:100%;max-width:700px;align-self:center;border-radius:16px;background:rgba(11,16,40,.9);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.comms-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(243,234,214,.07),rgba(243,234,214,0))}
.av{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--orange);overflow:hidden;background:#2b3a6a url(../img/space-story/rivera.webp) center 6%/170% no-repeat}
.av svg{display:block;width:100%;height:100%}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who b{font-size:15px}
.who span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.lamp{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.cs{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font:700 11px var(--mono);letter-spacing:.12em;color:var(--mute)}
.cs b{font-size:13px;color:var(--blue)}
.comms-b{display:flex;flex-direction:column;gap:10px;padding:14px 16px 18px}
#log{display:flex;flex-direction:column;gap:10px}
#log:empty{display:none}
#chatx{outline:none;min-height:1px}
.scene{align-self:center;margin:2px 0 4px;font:600 12.5px var(--mono);letter-spacing:.03em;padding:5px 12px;border-radius:6px;background:rgba(243,234,214,.07);color:var(--dim);border:1px dashed var(--line);text-align:center}
.msg{align-self:flex-start;max-width:min(560px,94%);display:flex;flex-direction:column;gap:3px}
.msg .st{font:600 11.5px var(--mono);letter-spacing:.08em;color:var(--mute)}
.msg .bub{padding:11px 15px;border-radius:4px 14px 14px 14px;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;border-left:4px solid var(--blue)}
.msg.u{align-self:flex-end;align-items:flex-end;max-width:min(430px,90%)}
.msg.u .bub{background:var(--orange);color:#1a0f08;font-weight:600;border-left:0;border-radius:14px 4px 14px 14px}
.msg .rcpt{font:600 12px var(--mono);color:var(--mute)}.msg .rcpt.rd{color:var(--blue)}
.in{animation:fIn .35s ease both}
.tx{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:4px 14px 14px 14px;background:var(--cream);color:#5a4a6a;font:700 11.5px var(--mono);letter-spacing:.1em}
.tx i{display:block;width:3px;height:14px;border-radius:2px;background:#5a4a6a;animation:bar .9s ease-in-out infinite}
.tx i:nth-child(2){animation-delay:.12s}.tx i:nth-child(3){animation-delay:.24s}.tx i:nth-child(4){animation-delay:.36s}
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:4px}
.chips .ptl{display:flex;align-items:center;gap:6px;font:700 11.5px var(--mono);letter-spacing:.12em;color:var(--mute)}
.chips .opts{justify-content:flex-end}
.chips .opt{border-radius:999px}
.composer{display:flex;gap:10px;align-items:center;margin-top:6px;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(243,234,214,.08);border:1px solid rgba(243,234,214,.25)}
.composer label{flex:1;min-width:0;display:flex}
.composer input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:8px 0;outline:none}
.ptt{flex:none;display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;border:0;background:var(--orange);color:#1a0f08;font-size:15px;font-weight:700;box-shadow:0 4px 0 var(--orange-d)}
.ptt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.ptt svg{width:16px;height:16px}

/* Briefing reel */
.reel{align-self:flex-start;width:min(100%,460px);border-radius:12px;overflow:hidden;background:var(--cream);color:var(--ink)}
.reel-s{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(143,195,255,.1) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(143,195,255,.1) 19px 20px),#0a1030}
.reel-n{position:absolute;left:10px;top:8px;font:700 11px var(--mono);letter-spacing:.14em;color:var(--cream);padding:3px 7px;border-radius:5px;background:rgba(5,8,22,.8)}
.reel-p{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--orange);color:#1a0f08;font-size:22px;padding:0 0 0 4px;box-shadow:0 0 0 6px rgba(255,133,82,.25)}
.reel-m:empty{display:none}
.reel-m{position:absolute;left:50%;top:calc(50% + 42px);transform:translateX(-50%);width:max-content;max-width:94%;text-align:center;line-height:1.25;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:rgba(5,8,22,.92);color:var(--cream)}
.reel-t{position:absolute;left:10px;bottom:8px;display:flex;gap:6px}
.reel-t span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;background:rgba(5,8,22,.85);color:var(--cream)}
.reel-t span+span{border:1px solid rgba(243,234,214,.4)}
.reel-d{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.reel-d b{font-size:15px}.reel-d>span{font-size:13.5px;color:#5a4a6a}
.tags{display:flex;gap:6px;margin-top:6px}
.tags span{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid #cdbf9c;color:#5a4a6a}
.reel-s{background-size:cover;background-position:center}
.reel-s::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,22,.75),rgba(5,8,22,.08) 55%)}
.reel-s.v-case-study{background-image:url(../img/space-medicine/case-study.webp)}
.reel-s.v-physiology{background-image:url(../img/space-medicine/physiology.webp)}
.reel-s.v-hypoxia{background-image:url(../img/space-medicine/hypoxia.webp)}
.reel-s.v-physics{background-image:url(../img/space-medicine/physics.webp)}
.reel-s.v-engineering{background-image:url(../img/space-medicine/engineering.webp)}

.file{align-self:flex-start;display:flex;align-items:center;gap:12px;width:min(100%,430px);padding:12px 14px;border-radius:12px;background:var(--cream);color:var(--ink)}
.file .ico{flex:none;width:44px;height:52px;border-radius:5px;background:#9a4a2e;color:var(--cream);display:grid;place-items:center;font:700 12px var(--mono)}
.file .fd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.file .fd b{font-size:15px;overflow-wrap:anywhere}.file .fd span{font-size:13px;color:#5a4a6a}
.file button{flex:none;padding:9px 14px;border-radius:999px;border:0;background:var(--ink);color:var(--cream);font-size:14px;font-weight:700}

/* Crew badge */
.badge{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);border-radius:18px;overflow:hidden;background:var(--cream);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
.badge::before{content:"";position:absolute;left:50%;top:10px;width:64px;height:10px;margin-left:-32px;border-radius:6px;background:var(--bg);opacity:.85;z-index:2}
.badge-p{position:relative;min-height:330px;background:repeating-linear-gradient(0deg,transparent 0 21px,rgba(143,195,255,.14) 21px 22px),repeating-linear-gradient(90deg,transparent 0 21px,rgba(143,195,255,.14) 21px 22px),#22306a}
.badge-p svg{position:absolute;inset:0;width:100%;height:100%}
.badge-img{position:absolute;left:0;right:0;top:14px;bottom:30px;background:url(../img/space-story/rivera.webp) center top/cover no-repeat}
.badge-p .strip{position:absolute;left:0;right:0;bottom:0;padding:7px 14px;background:var(--orange);color:#1a0f08;font:700 12px var(--mono);letter-spacing:.2em;display:flex;justify-content:space-between}
.badge-d{padding:clamp(26px,3vw,30px) clamp(18px,3vw,28px) clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:12px}
.badge-d .nm{font-family:var(--head);font-weight:600;font-size:clamp(23px,3vw,31px);line-height:1.1}
.badge-d .ro{font-size:15px;font-weight:600;color:#5a4a6a}
.badge-d p{margin:0;font-size:16px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats span{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:8px;background:#fbf6ea;border:1px solid #e2d5b6}
.stats strong{font:700 18px var(--mono)}.stats span span{padding:0;border:0;background:none;font-size:13px;color:#5a4a6a}
.fine{font-size:12.5px;color:#6a5a7a}
@media (max-width:640px){.badge{grid-template-columns:minmax(0,1fr)}.badge-p{min-height:230px}}

/* Resume */
.resume{display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:620px;align-self:center;width:100%}
.resume h1{margin:0;font-family:var(--head);font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.15}
.go{padding:11px 20px;border-radius:999px;border:1.5px solid var(--orange);background:rgba(255,133,82,.12);color:var(--orange);font-size:15px;font-weight:700}
.go:hover:not(:disabled){background:rgba(255,133,82,.26)}
.go.solid{background:var(--orange);color:#1a0f08;box-shadow:0 4px 0 var(--orange-d)}
.ghostb{padding:10px 16px;border-radius:999px;border:1px solid rgba(243,234,214,.3);background:transparent;font-size:14px;font-weight:600}

/* Rebuild the flight */
.flight{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.9fr);gap:16px;align-items:start}
.scale{position:relative;min-height:480px;min-width:0;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#04060f 0%,#0b1338 22%,#1c3f8c 58%,#6f8fc4 86%,#c9b3a6 100%)}
.scale .sc-stars{position:absolute;left:0;right:0;top:0;height:30%;background:radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 34% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 28%,#fff,transparent),radial-gradient(1px 1px at 76% 70%,#fff,transparent),radial-gradient(1px 1px at 90% 34%,#fff,transparent),radial-gradient(1px 1px at 46% 86%,#fff,transparent)}
.scale .sc-cl{position:absolute;height:22px;border-radius:999px;background:rgba(243,234,214,.5);filter:blur(3px)}
.scale .sc-rule{position:absolute;left:14%;top:5%;bottom:5%;width:14px;margin-left:-7px;background:repeating-linear-gradient(180deg,rgba(243,234,214,.75) 0 1.5px,transparent 1.5px 12px);border-left:1.5px solid rgba(243,234,214,.75)}
.scale .sc-bal{position:absolute;left:14%;width:26px;height:34px;margin:-17px 0 0 -40px;transition:top 1s cubic-bezier(.3,.8,.3,1)}
.scale .sc-top,.scale .sc-gnd{position:absolute;left:4%;font:700 12px var(--mono);letter-spacing:.06em}
.scale .sc-top{top:2%;color:var(--orange)}.scale .sc-gnd{bottom:1.5%;color:#1d1a2e}
.slot{position:absolute;left:11%;right:4%;transform:translateY(-50%);display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:2px dashed rgba(243,234,214,.5);background:rgba(9,14,34,.66);color:var(--cream);text-align:left;transition:background .25s,border-color .25s}
.slot .slot-d{width:16px;height:16px;border-radius:50%;background:#2a2238;border:2px solid var(--cream)}
.slot .slot-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .slot-a{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.slot .slot-l{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--dim)}
.slot .slot-x{font-size:13px;line-height:1.4;color:var(--dim)}
.slot.aim,.scale.dragging .slot:not(.has){border-color:var(--orange)}
.slot.over{background:rgba(255,133,82,.3)}
.slot.has{border:2px solid var(--ok);background:rgba(34,84,52,.72)}
.slot.has .slot-d{background:var(--ok)}.slot.has .slot-l{color:var(--cream)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;border-radius:10px;border:2px solid #d9c9a5;background:#fbf6ea;color:#2a2238;font-size:15px;font-weight:600;line-height:1.35;touch-action:none;transition:transform .15s}
.card:hover:not([aria-disabled=true]){transform:translateX(3px)}
.card.on{border-color:#9a4a2e;background:#9a4a2e;color:#fbf6ea}
.card .grip{flex:none;width:10px;height:16px;background:radial-gradient(circle,currentColor 1.2px,transparent 1.5px) 0 0/5px 5px;opacity:.55}
.card.ghost{position:fixed;z-index:50;margin:0;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:.96}
@media (max-width:640px){.flight{grid-template-columns:minmax(0,1fr)}.scale{min-height:570px}}

/* Trace the oxygen */
.route{border-radius:12px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(143,195,255,.08) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(143,195,255,.08) 19px 20px),#070b20;overflow:hidden}
.route svg{display:block;width:100%;height:auto}
.route .o2{transition:transform .7s ease}
.rlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rlist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1.5px dashed rgba(243,234,214,.25);min-height:44px;font-size:14px;font-weight:600;line-height:1.3}
.rlist li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:rgba(243,234,214,.25);color:#0f1430}
.rlist li.on{border:1.5px solid var(--blue);background:rgba(143,195,255,.14)}.rlist li.on b{background:var(--blue)}
@media (max-width:640px){.rlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.candle{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.candle svg{display:block;width:150px;height:170px}
.candle .fl{transform-origin:75px 84px;transition:transform .5s ease}
.candle .fl g{transform-origin:75px 84px;animation:flick 1.4s ease-in-out infinite}
.candle .glow{transition:opacity .5s ease,r .5s ease}
@media (max-width:560px){.candle{grid-template-columns:minmax(0,1fr);justify-items:center}}

/* Gauges */
.gauge{display:block;width:100%;max-width:150px;height:auto}
.gauge .ndl{transform-origin:60px 60px;transition:transform .9s cubic-bezier(.3,1.25,.5,1)}
.gauge text{font-family:var(--mono);font-weight:700}
.ann{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:30px;padding:4px 9px;border-radius:5px;font:700 11.5px var(--mono);letter-spacing:.08em;border:1px solid rgba(243,234,214,.2);background:#0a0e22;color:rgba(243,234,214,.3)}
.ann.g.on{background:#123a26;color:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(95,227,154,.35)}
.ann.a.on{background:#3d2c06;color:var(--amber);border-color:var(--amber);box-shadow:0 0 12px rgba(255,194,74,.35)}
.ann.r.on{background:#451412;color:#ffb1a8;border-color:var(--red);box-shadow:0 0 14px rgba(255,107,94,.5)}
.ann.b.on{background:#10284a;color:var(--blue);border-color:var(--blue)}
.ann.r.on.fl{animation:blink 1s steps(1) infinite}
.anns{display:flex;flex-wrap:wrap;gap:6px}
.dig{display:flex;flex-direction:column;padding:8px 10px;border-radius:8px;background:#050816;border:1px solid var(--line)}
.dig span{font-size:12px;color:var(--dim)}
.dig b{font:700 20px var(--mono);font-variant-numeric:tabular-nums}

/* Watch your crew */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:10px;border:1.5px solid rgba(243,234,214,.2);background:rgba(5,8,22,.5);color:var(--cream)}
.tab b{font:700 13px var(--mono)}.tab span{font-size:12px;color:var(--dim);text-align:center}
.tab[aria-selected=true]{border-color:var(--blue);background:rgba(143,195,255,.16)}
.tab.okk span{color:var(--ok)}
.cam{display:flex;flex-direction:column;gap:10px}
.cam-v{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#070b20}
.cam-v svg{display:block;width:100%;height:auto}
.cam-v .rec{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(5,8,22,.8);color:#ff9a8c}
.cam-v .rec i{width:8px;height:8px;border-radius:50%;background:#ff5a4a}
.cam-v .pb{position:absolute;top:10px;right:10px;font:700 11px var(--mono);letter-spacing:.14em;padding:4px 8px;border-radius:5px;background:rgba(5,8,22,.8);color:var(--mute)}
.gz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;justify-items:center;align-items:end}
.gz>div{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.gz .dig{width:100%}
.radio-b{padding:14px 16px;border-radius:4px 14px 14px 14px;background:var(--cream);color:var(--ink);border-left:4px solid var(--orange)}
.radio-b .lbl{display:block;font-size:12px;margin-bottom:4px}
.radio-b q,.radio-b .qt{font-size:17px;line-height:1.5;font-style:italic;quotes:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.hx{position:relative;text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(243,234,214,.3);background:rgba(5,8,22,.5);color:var(--cream)}
.hx b{font-size:15px}.hx span{font-size:13px;color:var(--dim)}.hx i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--orange)}
.hx.out{opacity:.6;border-color:rgba(243,234,214,.2)}.hx.out b{text-decoration:line-through}.hx.out i{color:var(--mute)}
.hx.it{border-color:var(--ok);background:rgba(34,84,52,.5)}.hx.it i{color:var(--ok)}

/* Pie */
.pie{display:block;border-radius:50%;background:conic-gradient(var(--orange) 0 21%,var(--blue) 21% 100%);transition:width .4s,height .4s}
.worked{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.pies2{display:flex;gap:14px;align-items:flex-end}
.pies2 div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--dim)}
.slide{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center}
.piebox{width:104px;height:104px;display:grid;place-items:center;border-radius:12px;border:1px dashed var(--line)}
.slide input[type=range]{width:100%;accent-color:var(--orange);height:28px;margin:0}
.ticks{position:relative;height:30px;margin:0 8px}
.ticks i{position:absolute;top:0;width:1.5px;height:8px;background:var(--mute)}
.ticks span{position:absolute;top:10px;transform:translateX(-50%);font:600 11.5px var(--mono);color:var(--mute);white-space:nowrap}
.ticks span.l{transform:none}.ticks span.r{transform:translateX(-100%)}
.sread{font-size:15px;line-height:1.5}.sread b{font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:3px}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(5,8,22,.5);border:1.5px solid rgba(143,195,255,.3)}
.prow.ok{border-color:var(--ok)}.prow.try{border-color:var(--try)}
.prow .pb2{width:96px;height:96px;display:grid;place-items:center}
.prow label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.num{width:76px;text-align:center;padding:7px;border-radius:8px;border:1.5px solid var(--blue);background:#050816;font:600 16px var(--mono)}
@media (max-width:560px){.worked,.slide{grid-template-columns:minmax(0,1fr);justify-items:start}.prow{grid-template-columns:64px minmax(0,1fr)}.prow .pb2{width:64px;height:64px;transform:scale(.66);transform-origin:left center}}

/* Atmosphere */
.eqn{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.eqn span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:8px;background:rgba(243,234,214,.08);min-width:64px;font-size:12px;color:var(--dim)}
.eqn span strong{font:700 20px var(--mono);color:var(--cream)}
.eqn b{font-size:20px;color:var(--dim)}
.vehs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.veh{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:rgba(5,8,22,.55);border:1.5px solid rgba(243,234,214,.2)}
.veh.ok{border-color:var(--ok)}.veh.try{border-color:var(--try)}
.veh-h{display:flex;align-items:center;gap:10px}
.veh-h svg{flex:none;width:46px;height:34px}
.veh-h b{flex:1;font-size:16px}
.tagp{font:700 11.5px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:var(--dim);color:#0f1430;white-space:nowrap}
.tagp.ok{background:var(--ok)}.tagp.try{background:var(--try)}
.veh .ctx{font-size:13.5px;line-height:1.45;color:var(--dim)}
.veh .sl{font-size:13px;font-weight:700;color:var(--dim)}
.veh .opt{padding:6px 11px;font-size:14px}
.chk{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.chk i,.mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--try);color:#0f1430}
.chk i.ok,.mark.ok{background:var(--ok)}

/* Live scenario */
.sim{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:14px;align-items:start}
.sim .pt-g{grid-column:1;grid-row:2}.sim .pt-r{grid-column:1;grid-row:3}.sim .pt-c{grid-column:2;grid-row:2/span 3}
.sim-intro{grid-column:1/-1}
.cluster{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:12px;background:#070b20;border:1px solid var(--line)}
.cluster .big{font:700 30px var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.radio{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:#070b20;border:1px solid var(--line);min-height:150px}
.radio .rm{padding:8px 12px;border-radius:4px 12px 12px 12px;background:rgba(243,234,214,.95);color:var(--ink);font-size:14px;line-height:1.4}
.start{padding:14px 18px;border-radius:12px;border:0;background:var(--orange);color:#1a0f08;font-size:17px;font-weight:700;box-shadow:0 5px 0 var(--orange-d)}
.start:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d)}
.mask{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:12px;border:2px solid var(--orange);color:var(--cream);background:repeating-linear-gradient(135deg,rgba(255,133,82,.2) 0 12px,rgba(5,8,22,.6) 12px 24px)}
.mask b{font-size:17px;padding:2px 10px;border-radius:6px;background:rgba(5,8,22,.85)}.mask span{font-size:12.5px;color:var(--dim);padding:1px 8px;border-radius:6px;background:rgba(5,8,22,.85)}
.box{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:rgba(5,8,22,.6);border:1.5px solid var(--blue)}
.box.red{background:rgba(90,10,20,.45);border-color:#ff8a7a}.box.red .lbl{color:#ff9a8c}
.box.grn{border-color:var(--ok)}.box.grn .lbl{color:var(--ok)}
.box label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.box .opt{border-color:rgba(243,234,214,.3);width:100%}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.g3 .opt{text-align:center;padding:10px 6px}
.calls{display:flex;flex-direction:column;gap:8px}
.callr{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:rgba(5,8,22,.55)}
.callr .mark{width:24px;height:24px;font-size:13px}
.callr b{display:block;font-size:15px}.callr span.t{font-size:14px;line-height:1.45;color:var(--dim)}
.sheet .callr{background:#fbf6ea;border:1px solid #e2d5b6}.sheet .callr span.t{color:#5a4a6a}
@media (max-width:700px){.sim{grid-template-columns:minmax(0,1fr);grid-template-rows:none}.sim .pt-g,.sim .pt-r,.sim .pt-c{grid-column:1;grid-row:auto}}

/* Debrief */
.debrief{padding:0;overflow:hidden}
.db-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:#2a2238;color:var(--cream)}
.db-h b{font-family:var(--head);font-weight:600;font-size:18px}
.db-r{display:grid;grid-template-columns:minmax(120px,.35fr) minmax(0,1fr);gap:14px;padding:14px 18px;border-bottom:1px solid #e2d5b6}
.db-r .v{font-size:17.5px;line-height:1.5}
.db-p{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.plist li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:700 12px var(--mono);letter-spacing:.04em;color:#5a4a6a}
@media (max-width:560px){.db-r{grid-template-columns:minmax(0,1fr);gap:4px}}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
.ptray{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ptray li{display:block;width:30px;height:30px}

/* Toasts and modal */
#toasts{position:fixed;top:82px;right:14px;z-index:20;width:min(360px,calc(100vw - 28px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:rgba(243,234,214,.97);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45);animation:tIn .4s cubic-bezier(.2,.8,.3,1) both;border-left:5px solid var(--blue)}
.toast .av{width:40px;height:40px;border-width:0}
.toast .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.toast .tk{font:700 11px var(--mono);letter-spacing:.12em;color:#5a4a6a}
.toast .tt{font-size:14px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toast.pat{border-left-color:var(--orange);align-items:center}
#modal:empty{display:none}
.ov{position:fixed;inset:0;z-index:30;background:rgba(4,7,20,.8);backdrop-filter:blur(4px);display:grid;place-items:start center;padding:60px 20px 20px;overflow:auto}
.logbook{width:min(640px,100%);border-radius:14px;overflow:hidden;background:var(--cream);color:#2a2238;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fIn .3s ease both}
.lb-h{position:relative;padding:22px 18px 14px;background:#2a2238 repeating-linear-gradient(0deg,transparent 0 21px,rgba(243,234,214,.07) 21px 22px);color:var(--cream);display:flex;flex-direction:column;border-bottom:6px solid var(--orange)}
.lb-h b{font-size:22px}
.lb-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(243,234,214,.92);color:#2a2238;font-size:20px;font-weight:700;line-height:1}
.lb-l{list-style:none;margin:0;padding:8px 22px 6px}
.lb-l li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px dashed #cdbf9c}
.lb-l li b{font-size:13px;color:#9a4a2e;line-height:1.5}
.lb-l li span{font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.5;font-style:italic}
.lb-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 22px 16px;font-size:12.5px;color:#6a5a4a}
.lb-f button{padding:9px 16px;border-radius:999px;border:1.5px solid #2a2238;background:transparent;color:#2a2238;font-size:14px;font-weight:700}
@media (max-width:480px){.lb-l li{grid-template-columns:minmax(0,1fr);gap:2px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
