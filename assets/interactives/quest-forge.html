<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Forge: an Interactivity Generator adventure</title>
<meta name="description" content="A whimsical fantasy remake of the Interactivity Generator demo. Pick a quest, hear the owl's counsel, enchant the wording, and bestow a working activity.">
<style>
:root{--ink:#16254a;--blue:#2779a7;--blue-d:#1c5a82;--gold:#ECD06F;--gold-d:#b8922e;--parch:#fbf3dc;--parch2:#f3e6bf;--line:#d9c48c;--text:#2a2438;--mute:#5a5068;--ember:#b4401a;--moss:#1f6b4e;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:#122040}
body{font:16px/1.6 var(--serif);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #f0a23a;outline-offset:2px}
.defs{position:absolute;width:0;height:0}

/* ---------- hero ---------- */
.hero{position:relative;height:clamp(440px,58vw,700px);overflow:hidden;background:#2779a7}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,#122040)}
.hero-txt{position:absolute;left:0;right:0;top:15%;text-align:center;padding:0 16px;z-index:2}
.hero-txt::before{content:"";position:absolute;left:50%;top:-8%;width:min(820px,96%);height:125%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,250,228,.78),rgba(255,250,228,.35) 60%,rgba(255,250,228,0));z-index:-1}
.sigil{width:46px;height:46px;margin:0 auto 4px;display:block}
.hero h1{margin:0;font-weight:400;font-size:clamp(40px,9.2vw,118px);line-height:1;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.hero h1 span{font-size:.62em;letter-spacing:.1em}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 6px;color:var(--ink)}
.rule i{display:block;width:clamp(50px,9vw,110px);height:1px;background:currentColor}
.rule b{width:8px;height:8px;border:1px solid currentColor;transform:rotate(45deg)}
.tagline{margin:0;font-size:clamp(13px,1.9vw,21px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tagline small{font-size:.72em}
.hnav{display:flex;justify-content:center;flex-wrap:wrap;gap:4px clamp(8px,2.4vw,30px);margin:clamp(14px,3.4vw,40px) auto 0;padding:8px 0;border-top:1px solid rgba(22,37,74,.35);border-bottom:1px solid rgba(22,37,74,.35);width:min(560px,92%)}
.hnav button{border:0;background:none;padding:4px 6px;font-weight:700;font-size:clamp(12px,1.5vw,15px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.hnav button:hover{color:#8a2f10}
.fly{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.leaf{animation:fall 11s linear infinite}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0)}100%{transform:translate(-260px,760px) rotate(540deg)}}
.glow{animation:gl 4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
.drag{animation:bob 9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ---------- forge (the app) ---------- */
.forge{background:radial-gradient(1200px 500px at 50% 0,#24507a,transparent),linear-gradient(#122040,#1a3358 60%,#16284a);padding:10px 14px 60px}
.app{max-width:940px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 2px 14px;color:#f4ead0}
.rank{display:flex;align-items:center;gap:10px}
.rank svg{width:44px;height:48px;flex:none}
.rank b{display:block;font-size:17px;letter-spacing:.05em}
.rank span{font-size:13.5px;color:#cdd8e6}
.seals{display:flex;gap:5px;align-items:center}
.seals svg{width:26px;height:26px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.st{border:1px solid rgba(236,208,111,.45);background:rgba(10,20,40,.35);border-radius:4px;padding:5px 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#e6dcc0;display:flex;gap:7px;align-items:center}
.st i{font-style:normal;font-size:12px;color:var(--gold)}
.st span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.st small{font-size:11.5px;letter-spacing:.02em;text-transform:none;font-weight:400;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;opacity:.85}
.st[aria-current="step"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.st[aria-current="step"] i{color:var(--ink)}
.st:disabled{cursor:default;opacity:.5}
.panel{position:relative;background:linear-gradient(#fbf3dc,#f5e9c6);border:1px solid var(--gold-d);box-shadow:0 0 0 5px #fbf3dc,0 0 0 6px var(--gold-d),0 24px 60px rgba(0,0,0,.45);border-radius:4px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.banner-art{display:block;width:100%;height:clamp(96px,15vw,140px);border-bottom:1px solid var(--gold-d)}
.body{padding:4px clamp(16px,3vw,28px) clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:18px}
h2{margin:0;font-size:clamp(22px,3vw,28px);font-weight:400;letter-spacing:.05em;color:var(--ink)}
.sub{margin:0;color:var(--mute)}
.grp{border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grp-rec{background:rgba(39,121,167,.09);border:1px solid rgba(39,121,167,.35)}
.grp-warn{background:rgba(180,64,26,.07);border:1px dashed rgba(180,64,26,.5)}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.gt{font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.gs{font-size:14px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.sc{position:relative;text-align:left;background:#fffaf0;border:1px solid var(--line);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 0 rgba(120,90,30,.18);transition:transform .15s}
.sc:nth-child(odd){transform:rotate(-.5deg)}.sc:nth-child(even){transform:rotate(.5deg)}
.sc:hover{transform:translateY(-3px);border-color:var(--gold-d)}
.sc[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue);transform:none}
.sc-top{display:flex;align-items:center;gap:10px}
.sc-top svg{width:46px;height:46px;flex:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.t-rec{color:var(--blue-d)}.t-warn{color:var(--ember)}
.sc .tt{font-weight:700;font-size:16.5px;line-height:1.3;color:var(--ink)}
.sc .rq{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kind{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:1px 8px}
.k-fun{background:var(--gold);color:var(--ink)}
.k-real{background:#e6edf7;color:#24457f;border-radius:999px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;text-transform:none;font-size:12px}
.sc.real{background:#fff;border-color:#cfd6df;border-radius:12px;transform:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 1px 3px rgba(27,36,48,.12)}
.sc.real:hover{transform:translateY(-3px);border-color:#9aa6b5}
.sc.real .tag{letter-spacing:.01em;text-transform:none;font-size:13px;font-weight:600;color:#3a4757}
.sc.real .tt{font-weight:600;font-size:15.5px;color:#1b2430}
.sc.real .rq{font-size:13.5px;color:#5b6675}
.done-rib{position:absolute;top:8px;right:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--moss);padding:1px 8px;border-radius:2px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.req{width:100%;min-height:104px;border:1px solid var(--line);border-radius:3px;padding:12px;font:inherit;font-style:italic;color:var(--text);background:#fffaf0;resize:none}
.btn{border:1px solid var(--gold-d);background:linear-gradient(#2a7fae,#1c5a82);color:#fff;border-radius:3px;padding:10px 20px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #123b57}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.s{background:#fffaf0;color:var(--blue-d);box-shadow:0 2px 0 rgba(120,90,30,.25)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.load ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.load li{display:flex;gap:10px;align-items:center;color:var(--mute);transition:color .2s}
.load li.done{color:var(--text)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.done .dot{background:var(--moss);border-color:var(--moss);color:#fff}
.model{display:block;margin-top:8px;font-size:13px;color:var(--mute);font-style:italic}
.owl-say{display:flex;gap:12px;align-items:flex-start}
.owl-say>svg{width:54px;height:58px;flex:none}
.bubble{position:relative;flex:1;background:#fffaf0;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.bubble::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;background:#fffaf0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble p{margin:0}
.badge{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--gold);border-radius:2px;padding:3px 12px}
.flag .bubble{background:#fff1e6;border:2px solid var(--ember)}
.flag .bubble::before{background:#fff1e6;border-color:var(--ember);border-width:2px;left:-8px}
.flag-l{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8f3210}
.flag strong{font-size:17px;color:#6f2709}
.note-box{border-radius:4px;padding:12px 16px;background:#fdf0dc;border:1px solid #e3b98a}
.note-box strong{color:#7a340c}.note-box p{margin:4px 0 0}
.ok-note{background:#eaf4ea;border-color:#b5d6bf}.ok-note strong{color:var(--moss)}
.frame{border:1px solid var(--gold-d);border-radius:3px;overflow:hidden;background:#fffaf0}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--ink);font-size:13.5px;color:#d6dcec}
.fhead b{color:var(--gold)}
.parts{display:flex;gap:4px}
.parts button{border:1px solid rgba(236,208,111,.6);background:none;color:#f4ead0;border-radius:2px;padding:3px 10px;font-size:13px}
.parts button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}
iframe.pv{display:block;width:100%;height:320px;border:0}
.fmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.fm{text-align:left;background:#fffaf0;border:1px solid var(--line);border-radius:3px;padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.fm:hover{border-color:var(--gold-d)}
.fm[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.fm .top{display:flex;gap:9px;align-items:center}
.fm .top svg{width:34px;height:34px;flex:none}
.fm .nm{font-weight:700;color:var(--ink);line-height:1.2}
.fm .pl{display:block;font-size:12.5px;font-weight:400;color:var(--mute)}
.fit{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;padding:2px 8px;white-space:nowrap}
.f-best{background:var(--moss);color:#fff}.f-good{background:#e4e9f0;color:#2c3b52}.f-weak{background:#fbe3cf;color:#8a3a0c}
.fm .gl{font-size:13px;font-weight:700;color:var(--blue-d)}
.fm .nt{font-size:14px;color:#453d55}
.qs{display:flex;flex-direction:column;gap:14px}
.q{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{border:1px solid var(--gold-d);background:#fffaf0;border-radius:3px;padding:7px 14px}
.ch button[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.fields{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.fg:first-child{border-top:0;padding-top:0}
.fg h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.field{display:flex;flex-direction:column;gap:3px}
.field span{font-size:13px;color:var(--mute)}
.field textarea{border:1px solid var(--line);border-radius:3px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical;min-height:38px;color:var(--text);background:#fffaf0}
.sticky{position:sticky;top:10px;display:flex;flex-direction:column;gap:12px}
.txt{white-space:pre-wrap;background:#fffaf0;border:1px solid var(--line);border-radius:3px;padding:12px 14px;font:inherit;font-size:14.5px;margin:0}
pre.code{margin:0;background:#101c36;color:#dbe4f2;border-radius:3px;padding:14px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.linkbtn{border:0;background:none;color:var(--blue-d);padding:4px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.copied{font-size:14px;color:var(--moss)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .4s ease-out}
.toast svg{width:30px;height:30px}
@keyframes pop{from{transform:translate(-50%,24px);opacity:0}}
.foot{max-width:940px;margin:22px auto 0;text-align:center;font-size:13.5px;color:#b9c6d8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4a80"/><stop offset=".26" stop-color="#2779a7"/><stop offset=".5" stop-color="#a5cbd3"/><stop offset=".66" stop-color="#f6e6a6"/><stop offset=".8" stop-color="#f3b566"/><stop offset="1" stop-color="#d9764a"/></linearGradient>
<linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2779a7"/><stop offset=".45" stop-color="#a5cbd3"/><stop offset=".75" stop-color="#f6e6a6"/><stop offset="1" stop-color="#f3b566"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fffbe0"/><stop offset=".25" stop-color="#ffe9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffd67a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#fff6c8"/><stop offset=".3" stop-color="#ffd870" stop-opacity=".8"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient>
<radialGradient id="orb" cx=".38" cy=".32"><stop offset="0" stop-color="#f1fdff"/><stop offset=".45" stop-color="#58b6d6"/><stop offset="1" stop-color="#1d2f6a"/></radialGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d7896"/><stop offset="1" stop-color="#39405f"/></linearGradient>
<linearGradient id="fallw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="brush" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="brush2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="mist" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="haze"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs></svg>

<header class="hero">
  <svg class="art" id="heroArt" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A painted sunset above a sea of clouds. A friendly dragon glides through the mist toward a floating tower, while a small wizard with a lantern watches from a cliff under a golden tree."></svg>
  <div class="hero-txt">
    <svg class="sigil" viewBox="0 0 48 48" aria-hidden="true" id="sigil"></svg>
    <h1>Quest <span>Forge</span></h1>
    <div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="tagline">Where lessons <small>become</small> adventures</p>
    <nav class="hnav" aria-label="Chapters" id="hnav">
      <button data-k="1">Begin</button><button data-k="2">Scry</button><button data-k="3">Enchant</button><button data-k="4">Bestow</button>
    </nav>
  </div>
</header>

<main class="forge" id="forge">
  <div class="app" id="app"></div>
  <p class="foot">A fantasy retelling of the Interactivity Generator demo. Every illustration here was drawn for this game. Responses are saved, so no dragons (or APIs) are disturbed.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';
/* =====================================================================
   ART: every picture below is original SVG drawn for Quest Forge
   ===================================================================== */
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function star(x, y, s, f, cls) { return '<path' + (cls ? ' class="' + cls + '"' : '') + ' d="M' + x + ' ' + (y - s) + 'Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) + 'Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + 'Z" fill="' + f + '"/>'; }
function clouds(seed, y0, rows, n, w, cols) {
  var r = rng(seed), h = '';
  for (var j = 0; j < rows; j++) for (var i = 0; i < n; i++) h += '<ellipse cx="' + Math.round(r() * w) + '" cy="' + Math.round(y0 + j * 52 + r() * 30) + '" rx="' + Math.round(110 + r() * 170) + '" ry="' + Math.round(26 + r() * 34) + '" fill="' + cols[(i + j) % cols.length] + '" opacity="' + (0.55 + r() * 0.4).toFixed(2) + '"/>';
  return h;
}
var SIGIL = '<circle cx="24" cy="24" r="22" fill="#16254a" stroke="#ECD06F" stroke-width="2"/><path d="M12 27h24l-4 5h-4v4h5v3H15v-3h5v-4h-4z" fill="#ECD06F"/><path d="M12 27c2-4 6-5 10-5h14v5z" fill="#ECD06F"/>' + star(24, 13, 7, '#fff6c8');

function heroArt() {
  var r = rng(11), h = '<rect width="1600" height="900" fill="url(#sky)"/>';
  for (var i = 0; i < 46; i++) h += '<circle cx="' + Math.round(r() * 1600) + '" cy="' + Math.round(r() * 230) + '" r="' + (0.6 + r() * 1.5).toFixed(1) + '" fill="#fff" opacity="' + (0.25 + r() * 0.6).toFixed(2) + '"/>';
  h += '<circle cx="880" cy="640" r="330" fill="url(#sun)"/>';
  // far peaks
  h += '<g filter="url(#brush)"><path d="M-40 660 120 520 210 585 340 430 455 565 565 500 700 615 850 548 1000 630 1180 575 1320 640 1460 560 1640 640V900H-40Z" fill="#6f97b6" opacity=".55"/><path d="M-40 700 80 620 200 668 300 590 420 675 600 640 760 690 1640 690V900H-40Z" fill="#8fb0c4" opacity=".6"/></g>';
  // small far islands
  h += '<g opacity=".7" transform="translate(-100 120)"><path d="M700 470q50-10 100 0q-14 30-40 44q-10 24-18 34q-8-22-20-36q-16-16-22-42z" fill="#55618a"/><ellipse cx="750" cy="470" rx="50" ry="7" fill="#7fa37b"/><path d="M742 470v-34l10-16 10 16v34z" fill="#e6d5b0"/><path d="M738 438l14-26 14 26z" fill="#a8452e"/></g>';

  } else if (S.step === 4) {

      owlSays('<span class="badge">' + fn(S.fmt) + (S.sc.kind === 'much' ? ', Activity ' + (S.part + 1) + ' of 2' : '') + '</span><p>Quest complete! Your seal is on the board. Here is everything a course needs to carry this activity.</p>') +
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Scroll of binding (plugin configuration)</span><p class="sub" style="font-size:15px">Paste this into Coursera’s plugin configuration editor.</p><pre class="code" id="json"></pre><div class="row"><button class="btn s" data-act="copy" data-k="json">Copy configuration</button><span class="copied" id="c-json" aria-live="polite"></span></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Plain-text version</span><p class="sub" style="font-size:15px">Add this to the reading so every learner can get the same content.</p><pre class="txt" id="plain"></pre><div class="row"><button class="btn s" data-act="copy" data-k="plain">Copy text</button><span class="copied" id="c-plain" aria-live="polite"></span></div></div>' +
      '<div class="row"><button class="btn" data-act="restart">Take another quest</button></div>';
  }
  app.innerHTML = h + '</div></div>';
  refresh();
}

/* ---------- edit fields ---------- */
var FIELDS = [];
function fieldsHTML() {
  var c = C(), f = S.fmt; FIELDS = [];
  function add(group, label, obj, key) { FIELDS.push({ g: group, l: label, o: obj, k: key }); }
  add('Heading', 'Title', c, 'title'); add('Heading', 'Instructions', c, 'intro');
  if (f === 'tabs' || f === 'reveal' || f === 'seq') c.items.forEach(function (it, i) { var n = f === 'seq' ? 'Step ' + (i + 1) : (f === 'tabs' ? 'Tab ' : 'Card ') + (i + 1); add(n, f === 'tabs' ? 'Tab label' : f === 'reveal' ? 'Front' : 'Step text (correct position ' + (i + 1) + ')', it, 'label'); if (f !== 'seq') add(n, f === 'tabs' ? 'Panel text' : 'Back', it, 'detail'); });
  if (f === 'sort') { c.cats.forEach(function (_, i) { add('Categories', 'Category ' + (i + 1), c.cats, i); }); cards(c).forEach(function (x, i) { add('Cards', 'Card ' + (i + 1) + ', belongs in ' + c.cats[x.cat], x.o, x.key); }); }
  if (f === 'quiz') c.quiz.forEach(function (q, i) { var g = 'Question ' + (i + 1); add(g, 'Question', q, 'q'); q.options.forEach(function (_, j) { add(g, 'Option ' + (j + 1) + (j === q.answer ? ' (correct)' : ''), q.options, j); }); add(g, 'Feedback', q, 'feedback'); });
  if (f === 'annot') c.annot.forEach(function (p) { if (typeof p !== 'string') add('Notes', 'Note for “' + p.t + '”', p, 'note'); });
  var out = '', last = null;
  FIELDS.forEach(function (fd, i) {
    if (fd.g !== last) { if (last !== null) out += '</div>'; out += '<div class="fg"><h3>' + esc(fd.g) + '</h3>'; last = fd.g; }
    var v = fd.o[fd.k];
    out += '<label class="field"><span>' + esc(fd.l) + '</span><textarea rows="' + (String(v).length > 44 ? 2 : 1) + '" data-f="' + i + '">' + esc(v) + '</textarea></label>';
  });
  return out + (last !== null ? '</div>' : '');
}

/* ---------- live bits ---------- */
var tmr = null;
function codeText(b) { return '<!-- HTML and CSS -->\n' + b.html + '\n\n// JavaScript\n' + b.script; }
function refresh() {
  var b = S.fmt && S.contents ? build(S.fmt, C()) : null;
  var pv = app.querySelector('iframe.pv'); if (pv && b) pv.srcdoc = srcdoc(b);
  var pl = document.getElementById('plain'); if (pl && b) pl.textContent = plain(S.fmt, C());
  var cb = document.getElementById('codebox'); if (cb && b) cb.textContent = codeText(b);
  var js = document.getElementById('json'); if (js && b) js.textContent = JSON.stringify({ html: b.html, script: b.script }, null, 2);
  if (S.analyzing) runLoad();
  postSize();
}
function runLoad() {
  var lis = app.querySelectorAll('[data-line]'), fast = matchMedia('(prefers-reduced-motion: reduce)').matches, d = fast ? 80 : 520;
  [].forEach.call(lis, function (li, i) { setTimeout(function () { li.classList.add('done'); li.querySelector('.dot').textContent = '✓'; }, d * (i + 1)); });
  setTimeout(function () {
    var sc = byId(S.pick);
    S.analyzing = false; S.sc = sc; S.resolved = false; S.split = false; S.part = 0; S.vq = { topic: null, goal: null }; S.showCode = false;
    if (sc.kind !== 'vague') { S.contents = sc.parts ? clone(sc.parts) : [clone(sc.content)]; S.rec = sc.rec; S.fmt = sc.rec; S.recText = sc.rationale; }
    else { S.contents = null; S.fmt = null; }
    S.step = 2; S.visited = 2; render();
  }, d * (lis.length + 1));
}
function award(id) {
  if (!id || S.seals.indexOf(id) > -1) return;
  S.seals.push(id);
  try { localStorage.setItem('quest-forge-seals', JSON.stringify(S.seals)); } catch (e) {}
  var n = S.seals.length, t = document.getElementById('toast'), up = RANKS[n] !== RANKS[n - 1];
  t.innerHTML = '<div class="toast">' + seal(true) + '<span>Seal earned: ' + n + ' of 6.' + (n === 6 ? ' You are a Loremaster of the Forge!' : up ? ' You are now a ' + RANKS[n] + '.' : '') + '</span></div>';
  setTimeout(function () { t.innerHTML = ''; }, 4200);
}
function go(k) { if (k <= S.visited || k === S.step + 1) { S.step = k; S.visited = Math.max(S.visited, k); if (k === 4) award(S.pick); render(); return true; } return false; }

/* ---------- events ---------- */
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (a === 'pick') { S.pick = k; render(); }
  else if (a === 'analyze') { S.analyzing = true; render(); }
  else if (a === 'go') go(+k);
  else if (a === 'fmt') { S.fmt = k; render(); }
  else if (a === 'part') { S.part = +k; render(); }
  else if (a === 'split') { S.split = true; render(); }
  else if (a === 'vq') { S.vq[t.getAttribute('data-q')] = k; render(); }
  else if (a === 'resolve') {
    var sc = clone(byId(S.vq.topic)), g = GOALS.filter(function (x) { return x[0] === S.vq.goal; })[0];
    sc.kind = 'rec'; S.sc = sc; S.resolved = true; S.contents = [clone(sc.content)]; S.rec = g[0]; S.fmt = g[0];
    S.recText = 'You said students need to ' + g[1].toLowerCase() + '. ' + fn(g[0]) + ' fits that goal best for this topic, and the other five formats are still here to compare.';
    render();
  }
  else if (a === 'restart') { S.step = 1; S.visited = 1; S.analyzing = false; S.sc = null; S.fmt = null; S.contents = null; S.pick = null; render(); }
  else if (a === 'code') { S.showCode = !S.showCode; render(); }
  else if (a === 'copy') {
    var txt = document.getElementById(k).textContent, msg = document.getElementById('c-' + k);
    var done = function () { msg.textContent = 'Copied'; setTimeout(function () { msg.textContent = ''; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { msg.textContent = 'Select the text to copy it.'; });
    else msg.textContent = 'Select the text to copy it.';
  }
});
app.addEventListener('input', function (e) {
  var i = e.target.getAttribute('data-f'); if (i === null) return;
  var fd = FIELDS[+i]; fd.o[fd.k] = e.target.value;
  var pl = document.getElementById('plain'); if (pl) pl.textContent = plain(S.fmt, C());
  clearTimeout(tmr); tmr = setTimeout(function () { var pv = app.querySelector('iframe.pv'); if (pv) { var b = build(S.fmt, C()); pv.srcdoc = srcdoc(b); var cb = document.getElementById('codebox'); if (cb) cb.textContent = codeText(b); } }, 300);
});
document.getElementById('hnav').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = +b.getAttribute('data-k'); if (k <= S.visited && k !== S.step) go(k);
  document.getElementById('forge').scrollIntoView();
});
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'ig-preview') return;
  [].forEach.call(document.querySelectorAll('iframe.pv'), function (f) { if (f.contentWindow === e.source) f.style.height = Math.max(200, Math.min(e.data.h, 1400)) + 'px'; });
  postSize();
});
function postSize() { if (parent !== window) parent.postMessage({ type: 'embed-resize', height: document.documentElement.scrollHeight }, '*'); }
if (window.ResizeObserver) new ResizeObserver(postSize).observe(document.body);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && parent !== window) parent.postMessage({ type: 'quest-forge-close' }, '*'); });

document.getElementById('heroArt').innerHTML = heroArt();
document.getElementById('sigil').innerHTML = SIGIL;
render();
})();
</script>
