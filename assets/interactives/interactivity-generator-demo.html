<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactivity Generator demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F6F7F9}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1B2430}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #2E5BBA;outline-offset:2px}
a{color:#2E5BBA}
.app{max-width:900px;margin:0 auto;padding:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:#1B2430;display:grid;place-items:center}
.brand b{font-size:15px}
.brand span{font-size:13px;color:#5B6675}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.st{border:1px solid #E3E7EC;background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;color:#5B6675;display:flex;gap:6px;align-items:center}
.st i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#EEF1F5;display:grid;place-items:center;font-size:11.5px;font-weight:600}
.st[aria-current="step"]{border-color:#1B2430;color:#1B2430;font-weight:600}
.st[aria-current="step"] i{background:#1B2430;color:#fff}
.st:disabled{cursor:default;opacity:.55}
.panel{background:#fff;border:1px solid #E3E7EC;border-radius:16px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.sub{margin:0;color:#5B6675}
.grp{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.grp-rec{background:#F4F8F6;border:1px solid #DCEAE2}.grp-warn{background:#FCF6F0;border:1px dashed #E8C9AC}.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.gt{font-weight:650;font-size:15px}.gs{font-size:13.5px;color:#5B6675}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.sc{text-align:left;background:#fff;border:1px solid #E3E7EC;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px;color:inherit}
.sc:hover{border-color:#9AA6B5}
.sc[aria-pressed="true"]{border-color:#2E5BBA;box-shadow:0 0 0 2px #2E5BBA}
.tag{align-self:flex-start;font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px}
.t-rec{background:#EAF3EE;color:#1F6B4E}
.t-warn{background:#FDF0E4;color:#9A4510}
.sc .tt{font-weight:600;font-size:15.5px;line-height:1.35}
.sc .rq{font-size:13.5px;color:#5B6675;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lbl{font-size:13px;font-weight:650;color:#2A3442}
.req{width:100%;min-height:96px;border:1px solid #D5DBE3;border-radius:10px;padding:12px;font:inherit;color:#1B2430;background:#FAFBFC;resize:none}
.btn{border:1px solid #1B2430;background:#1B2430;color:#fff;border-radius:999px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.s{background:#fff;color:#1B2430;border-color:#C9D0D9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.load{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.load li{display:flex;gap:10px;align-items:center;color:#5B6675;transition:color .2s}
.load li.done{color:#1B2430}
.load ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #C9D0D9;flex:none;display:grid;place-items:center;font-size:12px}
.done .dot{background:#1F7A5A;border-color:#1F7A5A;color:#fff}
.model{font-size:12.5px;color:#5B6675}
.flag{border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;background:#FFF4EE;border:2px solid #D9622B}.flag-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}.flag-i{width:28px;height:28px;border-radius:50%;background:#B4401A;display:grid;place-items:center;flex:none}.flag-l{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9A3412}.flag strong{font-size:16px;color:#7A2E0E}.flag p{margin:0;color:#3A2A1E;font-size:14.5px}
.banner{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:#FDF3E9;border:1px solid #F1D2B5}
.banner strong{color:#7E3A0E}
.banner p{margin:0;color:#3A2A1E;font-size:14.5px}
.ok-note{background:#EEF6F1;border-color:#C7E3D3}
.ok-note strong{color:#1F6B4E}
.rec{display:flex;flex-direction:column;gap:6px}
.badge{align-self:flex-start;font-size:13px;font-weight:650;background:#1B2430;color:#fff;border-radius:999px;padding:4px 12px}
.frame{border:1px solid #E3E7EC;border-radius:12px;overflow:hidden;background:#fff}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#F6F7F9;border-bottom:1px solid #E3E7EC;font-size:13px;color:#5B6675}
.fhead b{color:#1B2430}
.parts{display:flex;gap:4px}
.parts button{border:1px solid #D5DBE3;background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.parts button[aria-pressed="true"]{background:#1B2430;color:#fff;border-color:#1B2430}
iframe.pv{display:block;width:100%;height:320px;border:0;transition:opacity .2s}
iframe.pv.busy{opacity:.35}
.fmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px}
.fm{text-align:left;background:#fff;border:1px solid #E3E7EC;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;color:inherit}
.fm[aria-pressed="true"]{border-color:#2E5BBA;box-shadow:0 0 0 2px #2E5BBA}
.fm .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fm .nm{font-weight:600}
.fit{font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 8px;white-space:nowrap}
.f-best{background:#EAF3EE;color:#1F6B4E}
.f-good{background:#EEF1F5;color:#3A4757}
.f-weak{background:#FDF0E4;color:#9A4510}
.fm .gl{font-size:12.5px;font-weight:600;color:#5B6675}
.fm .nt{font-size:13.5px;color:#3A4757}
.qs{display:flex;flex-direction:column;gap:14px}
.q{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{border:1px solid #C9D0D9;background:#fff;border-radius:999px;padding:7px 14px}
.ch button[aria-pressed="true"]{background:#1B2430;color:#fff;border-color:#1B2430}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.fields{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px;border-top:1px solid #EEF1F5;padding-top:10px}
.fg:first-child{border-top:0;padding-top:0}
.fg h3{margin:0;font-size:13px;font-weight:650;color:#5B6675}
.field{display:flex;flex-direction:column;gap:3px}
.field span{font-size:12.5px;color:#5B6675}
.field textarea{border:1px solid #D5DBE3;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;min-height:38px;color:#1B2430}
.field textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.sticky{position:sticky;top:10px;display:flex;flex-direction:column;gap:12px}
.txt{white-space:pre-wrap;background:#FAFBFC;border:1px solid #E3E7EC;border-radius:10px;padding:12px 14px;font-size:14px;margin:0;color:#2A3442}
pre.code{margin:0;background:#1B2430;color:#DDE4EC;border-radius:10px;padding:14px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.linkbtn{border:0;background:none;color:#2E5BBA;padding:4px 0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.copied{font-size:13px;color:#1F7A5A}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app" id="app"></div>

(function () {
'use strict';
var FMT = { tabs: 'Tabbed explorer', reveal: 'Click-to-reveal', quiz: 'Inline quiz', seq: 'Sequencing', sort: 'Drag-to-classify', annot: 'Annotated text' };
var ORDER = ['tabs', 'reveal', 'quiz', 'seq', 'sort', 'annot'];

var SC = [
 { id: 'py', kind: 'rec', tag: 'Recommendation', title: 'Python: put code lines in order', course: 'Intro to Python',
   request: 'In my intro Python course, learners can write single lines but mix up the order of a short program. I want them to practice putting the lines of a program that averages test scores into a working order.',
   rec: 'seq', rationale: 'The goal is putting steps into a working order, so Sequencing fits. The app works out the true order first: a value has to exist before a later line can use it.',
   fit: { seq: ['best', 'Procedural understanding', 'Learners rebuild a working order, which is exactly the skill they’re missing.'], quiz: ['good', 'Checking reasoning', 'Tests why the order matters, without building it.'], annot: ['good', 'Code reading', 'Explains each line, but learners only read. Good as a follow-up.'], sort: ['weak', 'Categorizing', 'Sorting lines by role is possible, but it doesn’t practice order.'], reveal: ['weak', 'Recall', 'Hides each line’s purpose. Better for terms than for order.'], tabs: ['weak', 'Comparison', 'Tabs show one line at a time, which hides the order.'] },
   content: { title: 'Put the program in order', intro: 'This program averages three test scores. Put the lines in an order that would run.', code: true,

       { q: 'What would happen if print(round(average, 1)) ran first?', options: ['It would print 0', 'Python would show an error, because average doesn’t exist yet', 'It would wait until average exists'], answer: 1, feedback: 'Python runs top to bottom, so a name has to be created before it’s used.' } ],
     annot: [ { t: 'scores = [88, 92, 79]', note: 'A list: one name holding several values.' }, '\n', { t: 'total = sum(scores)', note: 'sum() adds every value in the list.' }, '\n', { t: 'average = total / len(scores)', note: 'len() counts the items, so this works for any number of scores.' }, '\n', { t: 'print(round(average, 1))', note: 'round(x, 1) keeps one decimal place before printing.' } ] } },
 { id: 'rock', kind: 'rec', tag: 'Recommendation', title: 'Earth science: how sedimentary rock forms', course: 'Earth Science',

   fit: { sort: ['best', 'Applying a framework', 'Learners choose a test for new questions, which is exactly where they freeze.'], quiz: ['good', 'Checking application', 'Works well for a few quick checks after the reading.'], annot: ['good', 'Decision rules', 'Walks through the choosing logic, but learners don’t practice choosing.'], tabs: ['good', 'Comparison', 'Lets learners compare tests side by side, but they still don’t choose one.'], reveal: ['weak', 'Recall', 'Learners can already define the tests, so recall isn’t the gap.'], seq: ['weak', 'Procedural understanding', 'The tests have no fixed order, so sequencing would be forced.'] },

       { label: 'Chi-square test', detail: 'Checks whether two categorical variables are related, like major and preferred study method.' },

     { title: 'Cranial nerves VII to XII', intro: 'Name each nerve’s job, then select the card to check.', cats: ['Sensory', 'Motor', 'Both'],

         { label: 'XII · Hypoglossal', detail: 'Moves the tongue.', cat: 1 } ],
       quiz: [

         { q: 'Which nerve moves the tongue?', options: ['Hypoglossal (XII)', 'Vagus (X)', 'Accessory (XI)'], answer: 0, feedback: 'Hypoglossal means “under the tongue.”' } ],
       annot: [ 'Asking a patient to smile tests the ', { t: 'facial nerve', note: 'Cranial nerve VII. Controls facial expression.' }, '. Saying “ah” tests the ', { t: 'glossopharyngeal', note: 'Cranial nerve IX. Helps with swallowing and taste.' }, ' and ', { t: 'vagus', note: 'Cranial nerve X. Raises the soft palate and helps control the heart, lungs, and digestion.' }, ' nerves, and sticking out the tongue tests the ', { t: 'hypoglossal nerve', note: 'Cranial nerve XII. Moves the tongue.' }, '.' ] } ] },

      if (sc.kind === 'much') h += '<div class="banner ok-note"><strong>Split into two activities of six.</strong><p>Switch between them above the preview to review each one.</p></div>';
      h += '<div class="rec"><span class="badge">Recommended: ' + FMT[S.rec] + '</span><p class="sub" style="color:#2A3442">' + esc(S.recText) + '</p></div>';
      if (cur.lv === 'weak') h += '<div class="banner"><strong>Built as you asked. Fit note:</strong><p>' + esc(cur.note) + '</p></div>';
      h += previewBlock('Live preview') + '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Explore other approaches for this content</span><div class="fmts" role="group" aria-label="Activity formats">' +
        fl.map(function (f) { return '<button class="fm" data-act="fmt" data-k="' + f.k + '" aria-pressed="' + (f.k === S.fmt) + '"><span class="top"><span class="nm">' + FMT[f.k] + '</span><span class="fit f-' + f.lv + '">' + (f.k === S.rec ? 'Recommended' : LEVEL[f.lv]) + '</span></span><span class="gl">' + esc(f.goal) + '</span><span class="nt">' + esc(f.note) + '</span></button>'; }).join('') + '</div></div>' +
        '<div class="row"><button class="btn" data-act="go" data-k="3">Use this format and refine →</button></div>';
    }
  } else if (S.step === 3) {
    h += '<div class="row" style="justify-content:space-between"><h2>Refine the wording</h2><button class="linkbtn" data-act="go" data-k="2">← Back to formats</button></div>' + why('s3') +
      '<div class="two"><div class="fields" id="fields">' + fieldsHTML() + '</div><div class="sticky">' + previewBlock('Preview') +
      '<div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Plain-text version · updates as you edit</span><pre class="txt" id="plain"></pre></div>' +
      '<button class="linkbtn" data-act="code" aria-expanded="' + S.showCode + '">' + (S.showCode ? 'Hide code' : 'Show code') + '</button>' + (S.showCode ? '<pre class="code" id="codebox"></pre>' : '') + '</div></div>' +
      '<div class="row"><button class="btn" data-act="go" data-k="4">Continue to export →</button></div>';
  } else if (S.step === 4) {
    h += '<div class="row" style="justify-content:space-between"><h2>Export for Coursera</h2><button class="linkbtn" data-act="go" data-k="3">← Back to edit</button></div>' + why('s4') +
      '<span class="badge">' + FMT[S.fmt] + (S.sc.kind === 'much' ? ' · Activity ' + (S.part + 1) + ' of 2' : '') + '</span>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Plugin configuration</span><p class="sub" style="font-size:14px">Paste this into Coursera’s plugin configuration editor.</p><pre class="code" id="json"></pre><div class="row"><button class="btn s" data-act="copy" data-k="json">Copy configuration</button><span class="copied" id="c-json" aria-live="polite"></span></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Plain-text version</span><p class="sub" style="font-size:14px">Add this to the reading so every learner can get the same content.</p><pre class="txt" id="plain"></pre><div class="row"><button class="btn s" data-act="copy" data-k="plain">Copy text</button><span class="copied" id="c-plain" aria-live="polite"></span></div></div>' +
      '<div class="row"><button class="btn" data-act="restart">Try another request</button></div>';
  }
  h += '</div>';
  app.innerHTML = h;
  refresh();
}

/* ---------- edit fields ---------- */
var FIELDS = [];
function fieldsHTML() {
  var c = C(), f = S.fmt; FIELDS = [];
  function add(group, label, obj, key, mono) { FIELDS.push({ g: group, l: label, o: obj, k: key, m: mono }); }
  add('Heading', 'Title', c, 'title'); add('Heading', 'Instructions', c, 'intro');
  if (f === 'tabs' || f === 'reveal' || f === 'seq') c.items.forEach(function (it, i) { var n = f === 'seq' ? 'Step ' + (i + 1) : (f === 'tabs' ? 'Tab ' : 'Card ') + (i + 1); add(n, f === 'tabs' ? 'Tab label' : f === 'reveal' ? 'Front' : 'Step text (correct position ' + (i + 1) + ')', it, 'label', c.code); if (f !== 'seq') add(n, f === 'tabs' ? 'Panel text' : 'Back', it, 'detail'); });
  if (f === 'sort') { c.cats.forEach(function (_, i) { add('Categories', 'Category ' + (i + 1), c.cats, i); }); cards(c).forEach(function (x, i) { add('Cards', 'Card ' + (i + 1) + ' · belongs in ' + c.cats[x.cat], x.o, x.key, c.code); }); }
  if (f === 'quiz') c.quiz.forEach(function (q, i) { var g = 'Question ' + (i + 1); add(g, 'Question', q, 'q'); q.options.forEach(function (_, j) { add(g, 'Option ' + (j + 1) + (j === q.answer ? ' (correct)' : ''), q.options, j); }); add(g, 'Feedback', q, 'feedback'); });
  if (f === 'annot') c.annot.forEach(function (p) { if (typeof p !== 'string') { add('Notes', 'Note for “' + p.t + '”', p, 'note'); } });
  var out = '', last = null;
  FIELDS.forEach(function (fd, i) {
    if (fd.g !== last) { if (last !== null) out += '</div>'; out += '<div class="fg"><h3>' + esc(fd.g) + '</h3>'; last = fd.g; }
    var v = fd.o[fd.k];
    out += '<label class="field"><span>' + esc(fd.l) + '</span><textarea rows="' + (String(v).length > 60 ? 2 : 1) + '" data-f="' + i + '"' + (fd.m ? ' class="mono"' : '') + '>' + esc(v) + '</textarea></label>';
  });
  return out + (last !== null ? '</div>' : '');
}

/* ---------- live bits ---------- */
var tmr = null;
function refresh() {
  var b = S.fmt && S.contents ? build(S.fmt, C()) : null;
  var pv = app.querySelector('iframe.pv');
  if (pv && b) { pv.srcdoc = srcdoc(b); }
  var pl = document.getElementById('plain'); if (pl && b) pl.textContent = plain(S.fmt, C());
  var cb = document.getElementById('codebox'); if (cb && b) cb.textContent = '<!-- HTML and CSS -->\n' + b.html + '\n\n// JavaScript\n' + b.script;
  var js = document.getElementById('json'); if (js && b) js.textContent = JSON.stringify({ html: b.html, script: b.script }, null, 2);
  if (S.analyzing) runLoad();
  postSize();
}
function runLoad() {
  var lis = app.querySelectorAll('[data-line]'), fast = matchMedia('(prefers-reduced-motion: reduce)').matches, d = fast ? 80 : 520;
  [].forEach.call(lis, function (li, i) { setTimeout(function () { li.classList.add('done'); li.querySelector('.dot').textContent = '✓'; }, d * (i + 1)); });
  setTimeout(function () {
    var sc = byId(S.pick);
    S.analyzing = false; S.sc = sc; S.resolved = false; S.split = false; S.part = 0; S.vq = { topic: null, goal: null }; S.showCode = false;
    if (sc.kind !== 'vague') { S.contents = sc.parts ? clone(sc.parts) : [clone(sc.content)]; S.rec = sc.rec; S.fmt = sc.rec; S.recText = sc.rationale; }
    else { S.contents = null; S.fmt = null; }
    S.step = 2; S.visited = 2; render();
  }, d * (lis.length + 1));
}

/* ---------- events ---------- */
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (a === 'pick') { S.pick = k; render(); var r = document.getElementById('req'); if (r) r.scrollTop = 0; }
  else if (a === 'analyze') { S.analyzing = true; render(); }
  else if (a === 'go') { k = +k; if (k <= S.visited || k === S.step + 1) { S.step = k; S.visited = Math.max(S.visited, k); render(); } }
  else if (a === 'fmt') { S.fmt = k; render(); }
  else if (a === 'part') { S.part = +k; render(); }
  else if (a === 'split') { S.split = true; render(); }
  else if (a === 'vq') { S.vq[t.getAttribute('data-q')] = k; render(); }
  else if (a === 'resolve') {
    var sc = byId(S.vq.topic), g = GOALS.filter(function (x) { return x[0] === S.vq.goal; })[0];
    S.sc = sc; S.resolved = true; S.contents = [clone(sc.content)]; S.rec = g[0]; S.fmt = g[0];
    S.recText = 'You said learners need to ' + g[1].toLowerCase() + '. ' + FMT[g[0]] + ' fits that goal best for this topic, and the other five formats are still here to compare.';
    render();
  }
  else if (a === 'restart') { S.step = 1; S.visited = 1; S.analyzing = false; S.sc = null; S.fmt = null; S.contents = null; render(); }
  else if (a === 'code') { S.showCode = !S.showCode; render(); }
  else if (a === 'copy') {
    var txt = document.getElementById(k).textContent, msg = document.getElementById('c-' + k);
    function done() { msg.textContent = 'Copied'; setTimeout(function () { msg.textContent = ''; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { msg.textContent = 'Select the text to copy it.'; });
    else msg.textContent = 'Select the text to copy it.';
  }
});
app.addEventListener('input', function (e) {
  var i = e.target.getAttribute('data-f'); if (i === null) return;
  var fd = FIELDS[+i]; fd.o[fd.k] = e.target.value;
  var pl = document.getElementById('plain'); if (pl) pl.textContent = plain(S.fmt, C());
  clearTimeout(tmr); tmr = setTimeout(function () { var pv = app.querySelector('iframe.pv'); if (pv) { var b = build(S.fmt, C()); pv.srcdoc = srcdoc(b); var cb = document.getElementById('codebox'); if (cb) cb.textContent = '<!-- HTML and CSS -->\n' + b.html + '\n\n// JavaScript\n' + b.script; } }, 300);
});
window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'ig-preview') return;
  [].forEach.call(document.querySelectorAll('iframe.pv'), function (f) { if (f.contentWindow === e.source) f.style.height = Math.max(200, Math.min(e.data.h, 1400)) + 'px'; });
  postSize();
});
function postSize() { if (parent !== window) parent.postMessage({ type: 'embed-resize', height: document.documentElement.scrollHeight }, '*'); }
if (window.ResizeObserver) new ResizeObserver(postSize).observe(document.body);
render();
})();
</script>
</body>
