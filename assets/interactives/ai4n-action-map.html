<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI for Nurses: action map</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url('../fonts/plus-jakarta-sans-latin.woff2') format('woff2');font-weight:200 800;font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#F3F7F5;color:#0F2E33;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0A6A67}a:hover{color:#0F2E33}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #0F2E33;outline-offset:2px}
.wrap{padding:16px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#4B6468;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tog{cursor:pointer;padding:7px 13px;border-radius:999px;border:1px solid #C9D9D3;background:#fff;font-size:13px;font-weight:600}
.tog[aria-pressed="true"]{background:#13263A;border-color:#13263A;color:#fff}
.lay{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.map{position:relative;width:100%;aspect-ratio:600/560}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.act{position:absolute;width:31.7%;height:23.2%;transform:translate(-50%,-50%);cursor:pointer;background:#fff;border:2.5px solid #BFE5DA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 14px;text-align:center;transition:box-shadow .2s,border-color .2s}
.act[aria-pressed="true"]{border-color:#13263A;box-shadow:0 10px 24px -10px rgba(15,46,51,.45)}
.act .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0A6A67}
.act .t{font-size:14px;font-weight:600;line-height:1.3;text-wrap:balance}
.act .ds{display:flex;gap:4px}
.goal{position:absolute;left:50%;top:50%;width:33.3%;height:28.6%;transform:translate(-50%,-50%);border-radius:50%;background:#13263A;color:#fff;box-shadow:0 0 0 6px #F3F7F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 20px;text-align:center}
.goal .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#BFE5DA}
.goal .t{font-size:13.5px;font-weight:500;line-height:1.35;text-wrap:balance}
.panel{padding:16px 18px;border-radius:16px;background:#fff;border:1px solid #DCE8E3;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-direction:column;gap:4px}
.ph .k{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0A6A67}
.ph .t{font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.25}
.step{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px}
.rail{display:flex;flex-direction:column;align-items:center}
.rail i{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:none}
.rail b{flex:1;width:2px;background:#DCE8E3}
.sb{display:flex;flex-direction:column;gap:7px;padding-bottom:14px;min-width:0}
.step:last-child .sb{padding-bottom:0}
.sl{font-size:12.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pat{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;border:1.5px solid #13263A}
.mis{font-size:13.5px;line-height:1.5;padding:8px 11px;border-radius:12px;background:#FFF1EC;border:1.5px dashed #E0704F}
.mis strong{display:block;font-weight:600}
.pr{font-size:14px;font-weight:500;line-height:1.4}
.cc{cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;border:1.5px solid}
.cc[aria-pressed="true"]{background:#13263A;color:#fff;border-color:#13263A!important}
.cd{font-size:13.5px;font-weight:300;line-height:1.55;color:#4B6468}
pre{margin:0;max-height:440px;overflow:auto;padding:14px;border-radius:14px;background:#13263A;color:#DCE8E3;font-size:12.5px;line-height:1.5}
.note{font-size:13px;line-height:1.5;color:#4B6468}
@media (max-width:820px){
  .lay{grid-template-columns:minmax(0,1fr)}
  .map{aspect-ratio:auto;display:flex;flex-direction:column;gap:10px}
  .map svg{display:none}
  .goal,.act{position:static;transform:none;width:auto;height:auto;border-radius:16px!important}
  .goal{box-shadow:none;padding:14px 18px}
  .act{align-items:flex-start;text-align:left;padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="legend"><span>Taught in</span><span><i class="dot" style="background:#0F8A86"></i>Course 1</span><span><i class="dot" style="background:#C9A200"></i>Course 2</span><span><i class="dot" style="background:#2E7DA6"></i>Course 3</span></div>
    <button type="button" class="tog" id="dataT" aria-pressed="false">View as data</button>
  </div>
  <div class="lay" id="mapWrap">
    <div class="map" id="map">
      <svg id="wires" viewBox="0 0 600 560" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="300" cy="280" rx="215" ry="205" fill="none" stroke="#BFE5DA" stroke-width="2" stroke-dasharray="7 7"></ellipse></svg>
      <div class="goal"><span class="k">Goal</span><span class="t">Nurses check AI outputs against their own judgment, and speak up when they don’t match</span></div>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </div>
  <div id="dataWrap" hidden style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="note">The same map as structured data: typed nodes and labeled edges.</span><button type="button" class="tog" id="copy">Copy JSON</button></div>
    <pre id="json"></pre>
  </div>
</div>
<script>
const GOAL='Nurses check AI outputs against their own judgment, and speak up when they don’t match';
const CC={1:'#0F8A86',2:'#C9A200',3:'#2E7DA6'};
const PAT={flagged:'Something is flagged',summarized:'Something is summarized',prioritized:'Something is prioritized',triggered:'Something is triggered'};
const C={modeltool:[1,'AI model vs. tool','The model makes the calculation. The tool is how that calculation shows up in the nurse’s workflow.'],io:[1,'Inputs and outputs','Vitals, labs, and chart entries go in. A score, flag, ranking, or text comes out.'],rules:[1,'Rule-based vs. machine learning','A rule-based system follows rules a person wrote. A machine learning model finds patterns in past data on its own.'],predgen:[1,'Predictive vs. generative AI','Predictive AI estimates how likely something is, like a fall. Generative AI writes new text, like a summary.'],gov:[1,'Governance and accountability','Organizations select and configure AI tools. Clinical accountability stays with the nurse.'],
 train:[2,'Training data','Models learn from historical records, including the gaps in them.'],feat:[2,'Features and labels','Features are the details a model looks at, like heart rate. The label is what it was trained to predict, like a fall.'],struct:[2,'Structured vs. unstructured data','Structured data lives in set fields, like vital signs. Unstructured data is free text, like nursing notes. Neither captures nonverbal cues or the patient’s surroundings.'],outputs:[2,'Four types of outputs','Probabilities, categories, summaries, and recommendations. Each carries uncertainty differently.'],sens:[2,'Sensitivity and specificity','A tool tuned to catch more cases will fire more often. That is a design choice, not a malfunction.'],bias:[2,'Bias and missing information','Gaps in documentation and unequal access to care get built into the data a model learns from.'],struggle:[2,'Where AI struggles','Missing data, patients who don’t fit typical patterns, practice that has changed, and generative AI smoothing over complexity.'],
 sbar:[3,'AI-SBAR','An adaptation of SBAR (Situation, Background, Assessment, Recommendation) for working through an AI output and sharing what you found.'],bedside:[3,'When AI and assessment diverge','Sometimes both agree, sometimes the tool misses what you see, and sometimes it flags a risk you haven’t noticed yet.'],escalate:[3,'Document, communicate, escalate','Put AI-informed concerns into the record and bring in a charge nurse, colleague, or provider when the output and the patient don’t match.'],docs:[3,'Reviewing generative AI output','Check what an AI-written summary captured and what it missed, and decide what the care team needs to know.'],setting:[3,'Adapting to the setting','The same score can call for different responses in behavioral health, medical-surgical, or critical care.']};
const M={m1:['“It’s just part of the record system.”','Before recent training, staff saw AI alerts as routine system notifications, and many still don’t know where those alerts come from.'],m2:['“The score sees the whole patient.”','A suicide risk tool scores answers to its questions, but it can’t capture nonverbal cues or the patient’s environment.'],m3:['“A high score tells me what to do.”','Experienced nurses check alerts against the patient in front of them. Newer nurses may rely more heavily on the number.'],m4:['“When an alert is wrong, the AI is wrong.”','Sepsis prompts kept firing after tasks were done, adding documentation work and frustration with the system.'],m5:['“The summary is the full story.”','An AI care plan summary made the work easier, but it could leave out parts of the assessment and invite too much reliance.']};
const A=[
 {t:'Notice when AI is shaping the work',p:['flagged','summarized','prioritized','triggered'],m:['m1'],pr:['01 · Comparing two kinds of AI (try it on this page)'],c:['modeltool','io','rules','predgen']},
 {t:'Ask what the tool can and can’t see',p:['flagged','prioritized'],m:['m2'],pr:['02 · Exploring what a model uses (try it on this page)'],c:['feat','struct','train','bias']},
 {t:'Weigh the output against the bedside assessment',p:['flagged','triggered'],m:['m3','m4'],pr:['03 · Practicing a clinical decision'],c:['outputs','sens','struggle','bedside','setting']},
 {t:'Review AI-written notes before relying on them',p:['summarized'],m:['m5'],pr:['01 · Comparing two kinds of AI (try it on this page)','Course 3 telehealth case: find what an AI summary missed'],c:['predgen','struct','docs']},
 {t:'Document and escalate with AI-SBAR',p:['flagged','triggered'],m:['m4'],pr:['Course 3 cases using AI-SBAR','Talking with a provider who has stopped responding to alerts'],c:['sbar','escalate','gov']}];
const POS=[[300,75],[504,217],[426,446],[174,446],[96,217]];
const RAD=['52% 48% 46% 54% / 58% 56% 44% 42%','46% 54% 52% 48% / 50% 46% 54% 50%','48% 52% 54% 46% / 44% 42% 58% 56%','54% 46% 48% 52% / 48% 54% 46% 52%','50% 50% 46% 54% / 54% 50% 50% 46%'];
let sel=0,csel=null;
const map=document.getElementById('map'),panel=document.getElementById('panel'),svg=document.getElementById('wires'),lay=document.getElementById('mapWrap'),btn=[],lines=[];
const NS='http://www.w3.org/2000/svg';
A.forEach((a,i)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',300);l.setAttribute('y1',280);l.setAttribute('x2',POS[i][0]);l.setAttribute('y2',POS[i][1]);svg.appendChild(l);lines.push(l);
  const b=document.createElement('button');b.type='button';b.className='act';b.style.left=(POS[i][0]/6)+'%';b.style.top=(POS[i][1]/5.6)+'%';b.style.borderRadius=RAD[i];
  const courses=[...new Set(a.c.map(id=>C[id][0]))].sort();
  b.innerHTML='<span class="k">Action '+(i+1)+'</span><span class="t">'+a.t+'</span><span class="ds" aria-hidden="true">'+courses.map(c=>'<i class="dot" style="width:9px;height:9px;background:'+CC[c]+'"></i>').join('')+'</span>';
  b.setAttribute('aria-label','Action '+(i+1)+': '+a.t+'. Taught in Course '+courses.join(' and '));
  b.onclick=()=>{sel=i;csel=null;update();};map.appendChild(b);btn.push(b);});
const narrow=window.matchMedia('(max-width:820px)');
function step(color,label,body,ring,last){return '<div class="step"><div class="rail"><i style="'+(ring?'border:2px solid '+color:'background:'+color)+'"></i>'+(last?'':'<b></b>')+'</div><div class="sb"><span class="sl" style="color:'+color+'">'+label+'</span>'+body+'</div></div>';}
function renderPanel(){const a=A[sel];
  let h='<div class="ph"><span class="k">Action '+(sel+1)+'</span><span class="t">'+a.t+'</span></div><div>';
  h+=step('#13263A','On a shift, it looks like','<div class="chips">'+a.p.map(p=>'<span class="pat">'+PAT[p]+'</span>').join('')+'</div>');
  h+=step('#A8401F','What gets in the way',a.m.map(k=>'<span class="mis"><strong>'+M[k][0]+'</strong>'+M[k][1]+'</span>').join(''));
  h+=step('#0A6A67','Practice',a.pr.map(p=>'<span class="pr">'+p+'</span>').join(''));
  h+=step('#4B6468','Only the information they need','<div class="chips">'+a.c.map(id=>'<button type="button" class="cc" data-c="'+id+'" aria-pressed="'+(csel===id)+'" style="border-color:'+CC[C[id][0]]+'"><i class="dot" style="width:8px;height:8px;background:'+CC[C[id][0]]+'"></i>'+C[id][1]+'</button>').join('')+'</div><span class="cd">'+(csel?'Course '+C[csel][0]+': '+C[csel][2]:'Select an idea to read about it.')+'</span>',true,true);
  panel.innerHTML=h+'</div>';
  panel.querySelectorAll('.cc').forEach(b=>b.onclick=()=>{csel=csel===b.dataset.c?null:b.dataset.c;renderPanel();post();});}
function update(){btn.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===sel)));
  lines.forEach((l,i)=>{l.setAttribute('stroke',i===sel?'#13263A':'#DCE8E3');l.setAttribute('stroke-width',i===sel?3:2);});
  if(narrow.matches)btn[sel].after(panel);else if(panel.parentNode!==lay)lay.appendChild(panel);
  renderPanel();post();}
narrow.addEventListener&&narrow.addEventListener('change',update);
function post(){try{parent.postMessage({type:'embed-resize',height:document.documentElement.scrollHeight},'*');}catch(e){}}
const json={nodes:[{id:'goal',type:'goal',label:GOAL}]
  .concat(A.map((a,i)=>({id:'a'+(i+1),type:'action',label:a.t})))
  .concat(Object.entries(PAT).map(([k,v])=>({id:k,type:'workflow_pattern',label:v})))
  .concat(Object.entries(M).map(([k,v])=>({id:k,type:'barrier',label:v[0].replace(/[“”]/g,''),evidence:v[1]})))
  .concat([...new Set(A.flatMap(a=>a.pr))].map((p,i)=>({id:'p'+(i+1),type:'practice',label:p.replace(' (try it on this page)','')})))
  .concat(Object.entries(C).map(([k,v])=>({id:k,type:'concept',label:v[1],course:v[0],description:v[2]}))),
 edges:[]};
const pid=p=>'p'+([...new Set(A.flatMap(a=>a.pr))].indexOf(p)+1);
A.forEach((a,i)=>{const id='a'+(i+1);json.edges.push({source:id,target:'goal',relation:'supports'});
  a.p.forEach(p=>json.edges.push({source:p,target:id,relation:'happens during'}));
  a.m.forEach(m=>json.edges.push({source:m,target:id,relation:'gets in the way of'}));
  a.pr.forEach(p=>json.edges.push({source:pid(p),target:id,relation:'practices'}));
  a.c.forEach(c=>json.edges.push({source:c,target:id,relation:'needed for'}));});
document.getElementById('json').textContent=JSON.stringify(json,null,2);
const dataT=document.getElementById('dataT'),dataWrap=document.getElementById('dataWrap');
dataT.onclick=()=>{const on=dataWrap.hidden;dataWrap.hidden=!on;lay.hidden=on;dataT.setAttribute('aria-pressed',String(on));dataT.textContent=on?'View as map':'View as data';post();};
document.getElementById('copy').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('json').textContent).then(()=>{e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy JSON',1500);});};
new ResizeObserver(post).observe(document.body);
document.fonts&&document.fonts.ready.then(post);
update();
</script>
</body>
</html>
